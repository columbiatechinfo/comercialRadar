<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEEK · A2L</title>
<style>
/* ==== 00-tokens.css ==== */
/* 00-tokens.css — a marca A2L em variáveis. Nenhuma cor nasce fora daqui. */

:root{
  /* marca */
  --navy:#0B2E59; --azul:#006DFF; --azul-t:#0057CC; --laranja:#F28C28; --laranja-t:#C96F16;
  --ok:#1F9D62; --alerta:#F28C28; --critico:#D64545; --roxo:#6D4AC7; --roxo-t:#5537A8;

  /* superfícies */
  --fundo:#F2F4F7; --sup:#FFFFFF; --sup2:#F7F9FC; --sup3:#EDF1F7;
  --linha:#E4E8EE; --linha2:#CFD6E0; --callout:#EAF1FB;

  /* texto */
  --tit:#12161C; --txt:#2A2E35; --fraco:#6B7684; --tenue:#98A2B3;

  /* fases da conferência */
  --f1:#8FA0BA; --f3:#006DFF; --f5:#F28C28; --f6:#D64545; --f8:#1F9D62;
  --f99:#5B6274; --f100:#0B2E59;

  /* tipografia */
  --face:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;

  /* medidas */
  --r:10px; --r2:7px; --r3:5px;
  --sombra:0 1px 2px rgba(11,46,89,.06),0 8px 24px rgba(11,46,89,.06);
  --sombra2:0 2px 6px rgba(11,46,89,.10),0 18px 48px rgba(11,46,89,.14);
  --filete:3px; --topo:52px; --fila:270px; --cart:250px;

  --t:.16s cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--face); background:var(--fundo); color:var(--txt);
  font-size:13.5px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input,select,textarea{background:none;border:0;outline:0}
a{color:var(--azul);text-decoration:none}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C7D0DC;border-radius:9px;border:2px solid transparent;
  background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#A9B5C5;background-clip:content-box}

:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:var(--r3)}

.mono{font-family:var(--mono)}
.cresce{flex:1}
[hidden]{display:none!important}

/* ---- o filete de marca 22/78: a assinatura da casa no topo da peça ---- */
#filete{position:fixed;left:0;right:0;top:0;height:var(--filete);display:flex;z-index:60}
#filete i{width:22%;background:var(--laranja)}
#filete b{width:78%;background:var(--navy)}

/* ==== 96-seek.css ==== */
/* 96-seek.css — SEEK · esteira de evidência
 *
 * As sete regiões do painel-evidencia-a2l, na vertical: filete, faixa do caso,
 * corpo em três colunas (fila · árvore · volume), faixa de veredito e rodapé de
 * decisão. Nada rola fora da árvore — o essencial cabe sem rolagem.
 */

/* ------------------------------------------------------------ regiões fixas */
:root{--faixa:46px; --vd:92px; --dec:58px; --fila:292px; --lado:300px}

#topo{
  position:fixed;left:0;right:0;top:var(--filete);height:var(--topo);z-index:50;
  background:var(--sup);border-bottom:1px solid var(--linha);
  display:flex;align-items:center;gap:16px;padding:0 14px 0 16px;
}
#topo .marca{display:flex;align-items:center;flex:none;padding-right:14px;
  border-right:1px solid var(--linha)}
#topo .marca svg{display:block;height:22px;width:auto}
#topo .ident{display:flex;flex-direction:column;line-height:1.25;flex:none}
#topo .ident strong{font-size:14px;font-weight:600;color:var(--tit);letter-spacing:.04em}
#topo .ident span{font-family:var(--mono);font-size:10px;color:var(--fraco);letter-spacing:.02em}
#topo .sessao{margin-left:auto;display:flex;align-items:center;gap:9px}
#topo .quem{display:flex;flex-direction:column;line-height:1.2;padding-left:11px;
  border-left:1px solid var(--linha);min-width:96px}
#topo .quem span:first-child{font-size:12px;font-weight:600;color:var(--tit);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
#topo .quem span:last-child{font-family:var(--mono);font-size:9.5px;color:var(--fraco)}

.chip{
  display:flex;align-items:center;gap:7px;height:29px;padding:0 10px;
  border:1px solid var(--linha);border-radius:99px;background:var(--sup2);
  font-family:var(--mono);font-size:10.5px;color:var(--fraco);
  transition:border-color var(--t),color var(--t);
}
.chip:hover{border-color:var(--linha2);color:var(--txt)}
.chip .pip{width:7px;height:7px;border-radius:50%;background:var(--tenue);flex:none}
.chip.on .pip{background:var(--ok)}
.chip.demo .pip{background:var(--laranja)}
.chip.ruim .pip{background:var(--critico)}

#tarja{
  display:flex;align-items:center;height:23px;padding:0 11px;border-radius:99px;
  background:repeating-linear-gradient(135deg,#FDF0DC 0 8px,#FBE4C0 8px 16px);
  border:1px solid #F0CE9A;color:#8A5410;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;margin-left:14px;
}
body.em-homolog #filete i{width:100%;background:repeating-linear-gradient(
  135deg,var(--laranja) 0 14px,var(--navy) 14px 28px)}
body.em-homolog #filete b{display:none}

/* ------------------------------------------------- faixa de identidade do caso */
#faixa{
  position:fixed;left:0;right:0;top:calc(var(--filete) + var(--topo));height:var(--faixa);
  z-index:45;background:var(--sup);border-bottom:1px solid var(--linha);
  display:flex;align-items:center;padding:0 14px;overflow:hidden;
}
#faixa .cf{display:flex;align-items:baseline;gap:6px;padding:0 13px;
  border-right:1px solid var(--linha);white-space:nowrap;flex:0 1 auto;min-width:0}
#faixa .cf:first-child{padding-left:0}
#faixa .cf:last-child{border-right:0}
#faixa .cf i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--tenue);
  text-transform:uppercase;letter-spacing:.08em}
#faixa .cf b{font-size:13px;font-weight:600;color:var(--tit);overflow:hidden;
  text-overflow:ellipsis}
#faixa .cf b.mono{font-family:var(--mono);font-size:12.5px}
#faixa .cf.vazio b{color:var(--tenue);font-weight:400}
#faixa .cf.coord{gap:8px}
#faixa .cf.coord .prec{font-family:var(--mono);font-size:9px;color:var(--tenue);
  border:1px solid var(--linha);border-radius:99px;padding:1px 6px}
#faixa .ir{
  font-family:var(--mono);font-size:9.5px;color:var(--azul);border:1px solid var(--linha);
  border-radius:99px;padding:3px 9px;background:var(--sup2);text-decoration:none;
  transition:all var(--t);
}
#faixa .ir:hover{border-color:var(--azul);background:var(--callout)}
#faixa .ir.copia{color:var(--fraco)}

/* ------------------------------------------------------------------- corpo */
#corpo{
  position:fixed;left:0;right:0;
  top:calc(var(--filete) + var(--topo) + var(--faixa));
  bottom:calc(var(--vd) + var(--dec));
  display:flex;min-height:0;
}

/* -------------------------------------------------------------- 1 · a fila */
#fila{width:var(--fila);flex:none;background:var(--sup);border-right:1px solid var(--linha);
  display:flex;flex-direction:column;min-height:0}
.fila-topo{padding:10px;border-bottom:1px solid var(--linha);display:flex;
  flex-direction:column;gap:8px}
.busca{display:flex;align-items:center;height:31px;padding:0 10px;background:var(--sup2);
  border:1px solid var(--linha);border-radius:var(--r2);transition:border-color var(--t)}
.busca:focus-within{border-color:var(--azul);background:var(--sup)}
.busca input{flex:1;font-size:12.5px;min-width:0;background:none;border:0;outline:0}
/* os dois recortes, um por linha: rótulo, ponto da cor escolhida e a lista */
.fila-filtros{display:flex;align-items:center;gap:8px}
.fila-filtros.dec{margin-top:-2px}
.fl-rot{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tenue);width:56px;flex:none}
.fila-filtros .pt{width:8px;height:8px;border-radius:50%;flex:none}
.fl-sel{
  flex:1;min-width:0;height:29px;padding:0 26px 0 9px;border-radius:var(--r2);
  border:1px solid var(--linha);background:var(--sup2);color:var(--txt);font-size:12px;
  appearance:none;-webkit-appearance:none;cursor:pointer;transition:border-color var(--t);
  background-image:linear-gradient(45deg,transparent 50%,var(--fraco) 50%),
                   linear-gradient(135deg,var(--fraco) 50%,transparent 50%);
  background-position:calc(100% - 14px) 13px, calc(100% - 9px) 13px;
  background-size:5px 5px, 5px 5px;background-repeat:no-repeat;
}
.fl-sel:hover{border-color:var(--linha2)}
.fl-sel:focus{outline:0;border-color:var(--azul);background-color:var(--sup)}
.fila-lista{flex:1;overflow-y:auto;min-height:0}
.fila-pe{padding:7px 11px;border-top:1px solid var(--linha);font-family:var(--mono);
  font-size:10px;color:var(--fraco);background:var(--sup2)}
.fi{display:block;width:100%;text-align:left;padding:9px 11px 9px 13px;
  border-bottom:1px solid var(--linha);position:relative;transition:background var(--t)}
.fi:hover{background:var(--sup2)}
.fi.on{background:var(--callout)}
.fi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.fi.on::before{background:var(--azul)}
.fi .l1{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.fi .l1 .pt{width:7px;height:7px;border-radius:50%;flex:none}
.fi .l1 b{font-size:12px;font-weight:600;color:var(--tit)}
.fi .ec{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--tenue)}
.fi .decidido{font-family:var(--mono);font-size:9.5px;color:var(--ok);font-weight:700}
.fi .l2{display:block;font-size:11.5px;color:var(--txt);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.fi .l3{display:block;font-size:10.5px;color:var(--fraco);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px}
.vazio{padding:22px 14px;font-size:12px;color:var(--tenue);text-align:center}

/* ------------------------------------------------------------- 2 · a árvore */
#arvore-caixa{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;
  background:var(--fundo)}
.arv-topo{flex:none;display:flex;align-items:center;gap:14px;padding:9px 14px;
  background:var(--sup);border-bottom:1px solid var(--linha)}
.arv-tit{display:flex;flex-direction:column;line-height:1.25}
.arv-tit strong{font-size:13px;font-weight:600;color:var(--tit)}
.arv-tit span{font-size:11px;color:var(--fraco)}
.arv-ferramentas{display:flex;gap:6px}
.bt{border-radius:var(--r2);font-size:12px;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;transition:all var(--t);border:1px solid transparent}
.bt.p{height:28px;padding:0 11px;background:var(--sup2);border-color:var(--linha);color:var(--txt)}
.bt.p:hover{border-color:var(--linha2);background:var(--sup3)}
.bt.p.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bt.pri{height:32px;padding:0 16px;background:var(--navy);color:#fff;font-weight:500}
.bt.pri:hover{background:#0a2749}
.bt.g{height:36px;padding:0 18px;font-size:13px}
.bt.escolhido{box-shadow:0 0 0 2px var(--azul) inset}
.bt:disabled{opacity:.55;cursor:default}

/* A ÁRVORE ROLA, E A ROLAGEM PRECISA APARECER.
 * Ela sempre rolou — 4 mil pixels de conteúdo em 350 de janela —, mas a barra
 * do sistema é sobreposta e some quando parada: dava para jurar que o conteúdo
 * tinha sido cortado. Agora a barra tem trilho próprio e fica reservada
 * (scrollbar-gutter), e as sombras de topo e pé aparecem só quando há mais
 * coisa para aquele lado. */
.arvore{
  flex:1;overflow-y:scroll;min-height:0;padding:12px 14px 20px;
  scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#B9C4D4 transparent;
  background:
    linear-gradient(var(--fundo) 30%, rgba(242,244,247,0)) top    /100% 26px no-repeat local,
    linear-gradient(rgba(242,244,247,0), var(--fundo) 72%) bottom /100% 26px no-repeat local,
    radial-gradient(farthest-side at 50% 0,   rgba(11,46,89,.13), transparent) top    /100% 11px no-repeat scroll,
    radial-gradient(farthest-side at 50% 100%,rgba(11,46,89,.13), transparent) bottom /100% 11px no-repeat scroll;
}
.arvore::-webkit-scrollbar{width:11px}
.arvore::-webkit-scrollbar-track{background:var(--sup2);border-left:1px solid var(--linha)}
.arvore::-webkit-scrollbar-thumb{
  background:#B9C4D4;border-radius:9px;border:3px solid var(--sup2);background-clip:content-box;
}
.arvore::-webkit-scrollbar-thumb:hover{background:#93A2B8;background-clip:content-box}
.vazio-g{padding:60px 20px;text-align:center;color:var(--tenue);font-size:13px}

/* CADA PASSAGEM DA CAIXA TEM O SEU TOM.
 * São três degraus — critério, fonte, campo — e antes os três eram quase da
 * mesma cor: a pessoa perdia de vista em que nível estava olhando. Agora o
 * ramo escurece de fora para dentro, o corpo do critério ganha a cor DELE
 * (bem diluída) e a folha volta ao branco, que é onde se lê valor. */
.ramo{margin-bottom:10px;background:var(--sup);border:1px solid var(--linha);
  border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden}
.ramo.n-campo{--cc:#1F9D62} .ramo.n-documento{--cc:#0B2E59}
.ramo.n-proximidade{--cc:#006DFF} .ramo.n-social{--cc:#6D4AC7}
.ramo.n-base{--cc:#5B6274}
.no-crit{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 13px;
  border-left:3px solid var(--cc);background:var(--sup);transition:background var(--t);
}
.no-crit:hover{background:var(--sup2)}
.no-crit .seta{font-size:10px;color:var(--tenue);width:11px;flex:none}
.no-crit .nm{font-size:13px;font-weight:600;color:var(--tit);letter-spacing:.01em}
.no-crit .res{font-family:var(--mono);font-size:10px;color:var(--fraco)}
.no-crit.tem .res{color:var(--ok)}
.no-crit .regra{font-size:10.5px;color:var(--tenue);text-align:right;max-width:46%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ramo-corpo{border-top:1px solid var(--linha);
  background:color-mix(in srgb, var(--cc) 5%, var(--sup2));
  border-left:3px solid color-mix(in srgb, var(--cc) 35%, transparent)}
@supports not (background:color-mix(in srgb, red 5%, white)){
  .ramo-corpo{background:var(--sup2);border-left-color:var(--linha2)}
}

.no-fonte{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 13px 8px 22px;border-top:1px solid var(--linha);background:transparent;
  transition:background var(--t);
}
.no-fonte .campos{font-size:9.5px;color:var(--tenue)}
.no-fonte:first-child{border-top:0}
.no-fonte:hover{background:var(--sup3)}
.no-fonte.piscou{background:var(--callout)}
.no-fonte .seta{font-size:10px;color:var(--tenue);width:11px;flex:none}
.no-fonte .nm{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--tit);
  letter-spacing:.04em}
.no-fonte.mudo .nm{color:var(--tenue);font-weight:400}
.no-fonte .sit{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:99px;
  background:var(--sup3);color:var(--fraco);border:1px solid var(--linha)}
.no-fonte .sit.ok{background:#E8F6EE;border-color:#BFE3CE;color:#14603D}
.no-fonte .sit.mudo{background:none;border-style:dashed;color:var(--tenue)}
.no-fonte .curado{font-family:var(--mono);font-size:9.5px;color:var(--azul)}
.no-fonte .chave{font-size:9.5px;color:var(--tenue)}
.no-corpo{background:var(--sup);border-top:1px solid var(--linha);padding:0 0 2px;
  box-shadow:inset 3px 0 0 color-mix(in srgb, var(--cc) 22%, transparent)}
.base-corpo{box-shadow:none}

/* o rótulo do grupo de campos: casamento · prova · contexto · guarda */
.grupo-cab{
  font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--tenue);padding:7px 13px 4px 26px;background:var(--sup2);
  border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);
}
.no-corpo > .grupo-cab:first-child{border-top:0}
.fonte-nota{padding:7px 14px 7px 26px;font-size:11px;color:var(--fraco);
  border-bottom:1px solid var(--linha);background:var(--sup2)}
.sem-dado{padding:12px 14px 12px 26px;font-size:11.5px;color:var(--fraco);line-height:1.5}

/* a folha: o campo, onde mora a aprovação */
.folha{
  display:grid;grid-template-columns:minmax(190px,1.15fr) 1fr 1fr 104px 64px;
  gap:10px;align-items:center;padding:7px 13px 7px 26px;
  border-bottom:1px solid var(--linha);position:relative;background:var(--sup);
}
.folha.g-prova{background:#FCFDFF}
.folha.g-guarda{background:var(--sup2)}
.folha.ausente{background:repeating-linear-gradient(135deg,var(--sup2) 0 6px,var(--sup) 6px 12px)}
.folha.ausente .fo-val b,.folha.ausente .fo-rot b{color:var(--tenue);font-weight:400}
.folha:last-child{border-bottom:0}
.folha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.folha.m-ok{background:#F4FBF7}
.folha.m-ok::before{background:var(--ok)}
.folha.m-nao{background:#FDF6F6}
.folha.m-nao::before{background:var(--critico)}
.folha.m-nao .fo-val b{text-decoration:line-through;color:var(--tenue)}
.folha.m-nota{background:#FEFBF6}
.folha.m-nota::before{background:var(--laranja)}
.fo-obs{
  grid-column:1 / -1;font-size:11px;line-height:1.45;padding:7px 10px;margin-top:2px;
  border-radius:var(--r3);background:var(--sup2);border:1px solid var(--linha);color:var(--txt);
}
.fo-obs b{display:block;font-family:var(--mono);font-size:8.5px;text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:2px}
.fo-obs i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;
  color:var(--tenue);margin-top:3px}
.fo-obs.nao{background:#FDF2F2;border-color:#F3C9C9}
.fo-obs.nao b{color:#A82F2F}
.fo-obs.nota{background:#FEF8F0;border-color:#F7DCBB}
.fo-obs.nota b{color:#8A5410}
.fo-rot{display:flex;flex-direction:column;gap:1px;min-width:0}
.fo-rot b{font-size:12px;font-weight:500;color:var(--tit)}
.folha.pesa .fo-rot b{font-weight:600}
.fo-rot .tec{font-size:9px;color:var(--tenue);letter-spacing:.02em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bate.ausente{background:none;border:1px dashed var(--linha2);color:var(--tenue)}
.fo-val{display:flex;flex-direction:column;min-width:0}
.fo-val i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--tenue);
  text-transform:uppercase;letter-spacing:.07em}
.fo-val b{font-size:12px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.bate{font-family:var(--mono);font-size:9.5px;padding:3px 8px;border-radius:99px;
  border:1px solid transparent;white-space:nowrap}
.bate.sim{background:#E8F6EE;border-color:#BFE3CE;color:#14603D}
.bate.nao{background:#FDECEC;border-color:#F3C9C9;color:#A82F2F}
.bate.neutro{background:var(--sup3);color:var(--tenue)}
/* um botão só, e vermelho: ele não aprova nada — abre a caixa onde se contesta
 * a evidência ou se anexa observação. Aprovar era um clique sem consequência;
 * contestar sem escrever por quê é o que ninguém audita depois. */
.fo-acoes{display:flex;justify-content:flex-end}
.mk{width:27px;height:27px;border-radius:var(--r3);border:1px solid #F0C8C8;
  background:#FDF6F6;color:var(--critico);font-size:12px;transition:all var(--t)}
.mk:hover{border-color:var(--critico);background:#FDECEC}
.mk.on.nao{background:var(--critico);border-color:var(--critico);color:#fff}
.mk.on.nota{background:var(--laranja);border-color:var(--laranja);color:#fff}
.fo-nota{grid-column:1 / -1;font-size:10.5px;color:var(--fraco);line-height:1.45;
  padding-left:2px;margin-top:-2px}

/* ------------------------------------------------------------ 3 · o volume */
#lado{width:var(--lado);flex:none;background:var(--sup);border-left:1px solid var(--linha);
  display:flex;flex-direction:column;min-height:0}
.lado-tela{position:relative;flex:1;min-height:220px;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,#FFF 0%,#F4F7FB 60%,#E9EFF6 100%)}
.lado-tela canvas{display:block;width:100%;height:100%;cursor:pointer}
/* BALÃO INDICADOR: aparece onde o ponteiro está e aponta para a área */
.cer-leg{
  position:absolute;z-index:5;max-width:230px;background:var(--sup);
  border:1px solid var(--linha2);border-radius:var(--r2);padding:8px 11px;
  box-shadow:var(--sombra2);pointer-events:none;display:flex;flex-direction:column;gap:3px;
}
.cer-leg b{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--tit);line-height:1.25}
.cer-leg b i{width:8px;height:8px;border-radius:50%;flex:none}
.cer-leg span{font-size:10.5px;color:var(--fraco);line-height:1.35}
.cer-leg em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--fraco);
  border-top:1px solid var(--linha);padding-top:4px;margin-top:1px}
.cer-leg em.ok{color:#14603D} .cer-leg em.nada{color:#8A5410} .cer-leg em.mudo{color:var(--tenue)}
.cer-leg::after{content:"";position:absolute;left:var(--seta,20px);width:9px;height:9px;
  background:var(--sup);border:1px solid var(--linha2);transform:rotate(45deg)}
.cer-leg.acima::after{bottom:-6px;border-top:0;border-left:0}
.cer-leg.abaixo::after{top:-6px;border-bottom:0;border-right:0}
.tese{flex:none;border-top:1px solid var(--linha);padding:9px 12px;background:var(--sup2);
  font-size:11.5px;color:var(--txt);line-height:1.45}
.tese i{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;
  color:var(--tenue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.criterios{flex:none;border-top:1px solid var(--linha);padding:10px 12px;display:flex;
  flex-direction:column;gap:6px}
.cri{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fraco);
  padding:5px 8px;border-radius:var(--r2);background:var(--sup2);border:1px solid var(--linha)}
.cri i{width:9px;height:9px;border-radius:50%;flex:none}
.cri span{flex:1}
.cri b{font-family:var(--mono);font-size:11px;color:var(--tenue)}
.cri.bate{background:#F4FBF7;border-color:#CDE9DA;color:var(--tit)}
.cri.bate b{color:var(--ok)}
.lado-pe{flex:none;border-top:1px solid var(--linha);padding:8px 12px;background:var(--sup2);
  font-family:var(--mono);font-size:9.5px;color:var(--tenue)}
.lado-pe .ficticio{color:var(--laranja-t)}

/* ------------------------------------------------- 4 · o parecer da IA */
#veredito{
  position:fixed;left:0;right:0;bottom:var(--dec);height:var(--vd);z-index:40;
  background:var(--sup);border-top:1px solid var(--linha);padding:0 14px;display:flex;
}
.par{
  flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding-left:13px;border-left:3px solid var(--pc);
}
.par.aprova{--pc:#1F9D62;--pt:#14603D}
.par.atencao{--pc:#F28C28;--pt:#8A5410}
.par.nega{--pc:#D64545;--pt:#A82F2F}
.par.nulo{--pc:#8FA0BA;--pt:#5B6274}
.par-cab{display:flex;align-items:baseline;gap:9px}
.par-cab i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--tenue);
  text-transform:uppercase;letter-spacing:.11em}
.par-cab b{font-size:14px;font-weight:600;color:var(--pc);letter-spacing:-.01em}
.par-chip{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:3px 10px;
  border-radius:99px;background:var(--sup2);border:1px solid var(--linha);color:var(--fraco)}
.par.aprova .par-chip{background:#E8F6EE;border-color:#BFE3CE;color:#14603D}
.par.atencao .par-chip{background:#FEF3E5;border-color:#F7DCBB;color:#8A5410}

/* a cor da FONTE é o desfecho: verde aprova, âmbar não basta, vermelho não
 * sustenta, cinza não há caso */
.par-texto{font-size:12.5px;line-height:1.4;color:var(--pt);max-width:none}
.par-motivos{display:flex;align-items:center;gap:7px;flex-wrap:wrap;overflow:hidden;
  max-height:20px}
.pm{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--fraco);
  background:var(--sup2);border:1px solid var(--linha);border-radius:99px;padding:2px 9px}
.pm i{width:6px;height:6px;border-radius:50%;background:var(--mc)}
.pm b{color:var(--tit);font-weight:600}
.pm em{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--tenue);
  border-left:1px solid var(--linha);padding-left:6px;margin-left:2px}
.pm.vazio{background:none;border-style:dashed;color:var(--tenue)}
.pr{font-size:10.5px;color:#8A5410;background:#FEF8F0;border:1px solid #F7DCBB;
  border-radius:99px;padding:2px 10px}
.pr b{color:#6F420B}

/* ---------------------------------------------------------- 5 · a decisão */
#decisao{
  position:fixed;left:0;right:0;bottom:0;height:var(--dec);z-index:40;
  background:var(--sup2);border-top:1px solid var(--linha);
  display:flex;align-items:center;gap:16px;padding:0 14px;
}
.dec-estado{display:flex;flex-direction:column;line-height:1.25;padding-right:16px;
  border-right:1px solid var(--linha);min-width:190px}
.dec-estado b{font-size:13px;font-weight:600;color:var(--tenue)}
.dec-estado.feito b{color:var(--tit)}
.dec-estado span{font-size:10.5px;color:var(--fraco)}
.dec-estado span b{font-size:10.5px;color:var(--tit)}
.dec-estado .alerta{color:var(--critico)}
.dec-curadoria{font-size:11.5px;color:var(--fraco)}
.dec-curadoria b{font-family:var(--mono);color:var(--azul);font-weight:600}
#decisao .acoes{display:flex;gap:7px;flex:none;align-items:center}
/* o "sugerido" fica DENTRO do botão: pendurado acima, ele era cortado pela
 * borda da faixa — e etiqueta cortada parece defeito, não destaque */
#decisao .bt .sug{
  font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:.08em;
  background:rgba(255,255,255,.22);color:#fff;padding:2px 6px;border-radius:99px;
  margin-left:8px;white-space:nowrap;
}

/* ---- território e rua no diálogo ---- */
.terr-grande{height:340px;border:1px solid var(--linha);border-radius:var(--r2);
  overflow:hidden;background:#F7F9FC}
.terr-grande canvas{display:block;width:100%;height:100%}
.terr-lista{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.tl{display:flex;align-items:center;gap:9px;font-size:12px;padding:6px 9px;
  border-radius:var(--r3);background:var(--sup2);border:1px solid var(--linha)}
.tl i{width:9px;height:9px;border-radius:50%;flex:none}
.tl span{flex:1;color:var(--txt)}
.tl b{font-size:11.5px;color:var(--tit)}
.tl em{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--ok)}
.tl.fora{background:#FDF2F2;border-color:#F3C9C9}
.tl.fora em{color:var(--critico)}
.rua-aviso{background:var(--callout);border:1px solid #CFE0F7;color:var(--navy);
  font-size:11.5px;line-height:1.5;padding:10px 12px;border-radius:var(--r2);
  margin-bottom:12px}
.rua-tela{height:320px;border:1px solid var(--linha);border-radius:var(--r2);
  overflow:hidden;background:var(--sup3);display:grid;place-items:center}
.rua-tela iframe{width:100%;height:100%;border:0;display:block}

/* ------------------------------------------------------------- acessórios */
.cresce{flex:1}
#torradas{position:fixed;right:14px;bottom:calc(var(--dec) + var(--vd) + 12px);z-index:90;
  display:flex;flex-direction:column;gap:7px}
#torradas .t{background:var(--navy);color:#fff;font-size:12px;padding:9px 13px;
  border-radius:var(--r2);box-shadow:var(--sombra2);transition:opacity .4s,transform .4s}
#torradas .t.ruim{background:var(--critico)}
#torradas .t.vai{opacity:0;transform:translateY(6px)}

#modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center}
.modal-fundo{position:absolute;inset:0;background:rgba(11,46,89,.32)}
.modal-caixa{position:relative;background:var(--sup);border-radius:var(--r);
  box-shadow:var(--sombra2);width:min(560px,92vw);max-height:82vh;display:flex;
  flex-direction:column;overflow:hidden}
.modal-caixa header{display:flex;align-items:center;padding:13px 15px;
  border-bottom:1px solid var(--linha)}
.modal-caixa header strong{font-size:14px;color:var(--tit)}
.modal-caixa header button{margin-left:auto;color:var(--fraco)}
#modal-corpo{padding:15px;overflow:auto}
#modal-pe{padding:12px 15px;border-top:1px solid var(--linha);display:flex;
  justify-content:flex-end;gap:8px}

/* ---------------------------------------------------------------- entrada */
#entrada{position:fixed;inset:0;z-index:100;background:var(--fundo);display:grid;
  place-items:center;padding:20px}
.ent-caixa{width:min(390px,94vw);background:var(--sup);border:1px solid var(--linha);
  border-radius:var(--r);box-shadow:var(--sombra2);padding:0 26px 22px;overflow:hidden;
  display:flex;flex-direction:column}
.ent-marca{display:flex;height:var(--filete);margin:0 -26px 22px}
.ent-marca i{width:22%;background:var(--laranja)}
.ent-marca b{width:78%;background:var(--navy)}
.ent-logo{display:flex;justify-content:center;margin-bottom:12px}
.ent-logo svg{height:30px;width:auto}
.ent-caixa h1{font-size:17px;font-weight:600;color:var(--tit);text-align:center;
  letter-spacing:.06em}
.ent-sub{font-family:var(--mono);font-size:10.5px;color:var(--fraco);text-align:center;
  margin-bottom:18px}
.ent-caixa label{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--tenue);margin-bottom:5px}
.ent-caixa input{height:38px;border:1px solid var(--linha);border-radius:var(--r2);
  background:var(--sup2);padding:0 12px;font-size:13.5px;margin-bottom:14px;
  transition:border-color var(--t)}
.ent-caixa input:focus{border-color:var(--azul);background:var(--sup)}
.ent-espera{background:var(--callout);border:1px solid #CFE0F7;color:var(--navy);
  font-size:12px;padding:9px 11px;border-radius:var(--r2);margin-bottom:12px;text-align:center}
.ent-erro{background:#FDECEC;border:1px solid #F3C9C9;color:#A82F2F;font-size:12px;
  padding:9px 11px;border-radius:var(--r2);margin-bottom:12px}
.bt.fantasma{background:none;border:0;color:var(--fraco);height:30px;font-size:12px;
  margin-top:8px}
.bt.fantasma:hover{color:var(--txt)}
.bt.homolog{width:100%;height:36px;margin-top:8px;border-radius:var(--r2);
  background:repeating-linear-gradient(135deg,#FDF3E6 0 10px,#FAE9D2 10px 20px);
  border:1px solid #F0CE9A;color:#8A5410;font-size:12.5px;font-weight:500}
.ent-homolog-pe{margin-top:7px;font-size:10.5px;line-height:1.45;color:var(--fraco);
  text-align:center}
.ent-pe{font-size:10.5px;color:var(--fraco);line-height:1.5;margin-top:14px;text-align:center}
.ent-cred{font-family:var(--mono);font-size:9.5px;color:var(--tenue);text-align:center;
  margin-top:12px;padding-top:12px;border-top:1px solid var(--linha)}

#dica{position:fixed;z-index:80;width:268px;background:var(--sup);border:1px solid var(--linha);
  border-radius:var(--r);box-shadow:var(--sombra2);padding:12px 13px;pointer-events:none}

/* ------------------------------------------------------------- responsivo */
@media (max-width:1220px){
  :root{--fila:250px;--lado:240px}
  .no-crit .regra{display:none}
  .folha{grid-template-columns:minmax(150px,1.2fr) 1fr 1fr 96px 60px}
}
@media (max-width:1000px){
  #lado{display:none}
  .folha{grid-template-columns:1fr 1fr;gap:6px}
  .fo-bate,.fo-acoes{grid-column:auto}
}

/* ------------------------------------------------------------------------
 * A SEÇÃO DAS IMAGENS — a evidência que se olha
 * --------------------------------------------------------------------- */
/* dentro do rolo da árvore: rola junto e some quando a pessoa desce */
#imagens{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);
  box-shadow:var(--sombra);overflow:hidden;margin-bottom:10px}
.img-cab{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 13px;transition:background var(--t);border-left:3px solid var(--laranja)}
.img-cab:hover{background:var(--sup2)}
.img-cab .seta{font-size:10px;color:var(--tenue);width:11px;flex:none}
.img-cab .nm{font-size:12.5px;font-weight:600;color:var(--tit)}
.img-cab .res{font-family:var(--mono);font-size:10px;color:var(--fraco)}
.img-cab .lgpd{font-size:10px;color:var(--tenue);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:42%}
.img-vazio{padding:12px 14px 14px 26px;border-top:1px solid var(--linha);background:var(--sup2);font-size:11.5px;color:var(--fraco);line-height:1.5}
/* a tira preenche a largura quando há poucos cartões e ROLA quando passa:
 * grade de colunas automáticas com piso de 190 px resolve os dois casos */
.img-rolo{position:relative;padding:2px 13px 11px 26px;border-top:1px solid var(--linha);
  background:var(--sup2)}
.img-tira{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;
  overflow-x:auto;scroll-behavior:smooth;padding-bottom:2px;
}
.img-tira::-webkit-scrollbar{height:7px}
.rola{
  position:absolute;top:34px;width:28px;height:28px;border-radius:50%;z-index:3;
  background:var(--sup);border:1px solid var(--linha2);color:var(--txt);font-size:15px;
  box-shadow:var(--sombra);display:none;place-items:center;
}
.img-rolo.tem-rolo .rola{display:grid}
.rola.esq{left:10px} .rola.dir{right:3px}
.rola:disabled{opacity:.35;cursor:default}
.img-cart{
  background:var(--sup);border:1px solid var(--linha);min-width:0;height:176px;
  border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:all var(--t);
  display:flex;flex-direction:column;
}
.img-cart figcaption{flex:1;min-height:0;overflow:hidden}
.img-cart.terr .img-tela{background:#F7F9FC}
.img-cart.terr canvas{display:block;width:100%;height:100%}
.img-tela.rua-cap{display:grid;place-items:center;
  background:linear-gradient(160deg,#EAF1FB 0%,#DDE7F5 100%)}
.rua-icone{font-size:30px;color:#7FA6DC}
.img-cart:hover{border-color:var(--linha2);box-shadow:var(--sombra)}
.img-cart:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.img-tela{position:relative;height:82px;background:var(--sup3)}
.img-tela img{display:block;width:100%;height:100%;object-fit:cover}
.img-sel{position:absolute;left:7px;top:7px;font-family:var(--mono);font-size:8.5px;
  text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px}
.img-sel.ok{background:#E8F6EE;color:#14603D;border:1px solid #BFE3CE}
.img-sel.nao{background:#FDECEC;color:#A82F2F;border:1px solid #F3C9C9}
.img-cart.inapta .img-tela img{filter:grayscale(.5) contrast(.85)}
.img-cart figcaption{padding:7px 9px 8px;display:flex;flex-direction:column;gap:2px}
.img-cart figcaption b{font-family:var(--mono);font-size:9px;color:var(--fraco);
  letter-spacing:.04em}
.img-cart figcaption span{font-size:11px;color:var(--txt);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.img-cart figcaption i{font-style:normal;font-size:9px;color:var(--tenue)}

.img-grande{position:relative;border-radius:var(--r2);overflow:hidden;background:var(--sup3)}
.img-grande img{display:block;width:100%;height:auto}
.img-tarja{position:absolute;left:0;right:0;bottom:0;background:rgba(168,47,47,.92);
  color:#fff;font-size:11.5px;padding:8px 12px;line-height:1.4}
.img-legenda{margin-top:12px;font-size:12.5px;line-height:1.55;color:var(--txt)}
.img-legenda i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;
  color:var(--tenue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.img-meta{margin-top:9px;font-size:9.5px;color:var(--tenue)}

/* ------------------------------------------------------------------------
 * A CAIXA DE OBSERVAÇÃO
 * --------------------------------------------------------------------- */
.obs-campo{display:flex;flex-direction:column;gap:6px;background:var(--sup2);
  border:1px solid var(--linha);border-radius:var(--r2);padding:10px 12px;margin-bottom:14px}
.oc{display:flex;align-items:baseline;gap:10px;font-size:12.5px}
.oc i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--tenue);
  text-transform:uppercase;letter-spacing:.08em;width:86px;flex:none}
.oc b{color:var(--tit);font-weight:600;min-width:0;word-break:break-word}
.obs-rot{display:block;font-family:var(--mono);font-size:9px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--tenue);margin-bottom:6px}
#modal-corpo textarea{
  width:100%;border:1px solid var(--linha);border-radius:var(--r2);background:var(--sup2);
  padding:10px 12px;font:inherit;font-size:13px;line-height:1.5;resize:vertical;
  transition:border-color var(--t);
}
#modal-corpo textarea:focus{outline:0;border-color:var(--azul);background:var(--sup)}
.obs-ajuda{margin-top:10px;font-size:11px;line-height:1.5;color:var(--fraco)}
.obs-ajuda b{color:var(--tit)}
.bt.pri.ruim{background:var(--critico)}
.bt.pri.ruim:hover{background:#b93a3a}
#modal-pe{align-items:center}

/* ------------------------------------------------------------------------
 * ORDENS DE SERVIÇO E IMPACTO FINANCEIRO
 * --------------------------------------------------------------------- */
.ramo.n-os{--cc:#5B6274} .ramo.n-impacto{--cc:#0E8C9E}
.os-texto{padding:10px 13px 6px 26px}
.os-texto textarea{
  width:100%;border:1px solid var(--linha);border-radius:var(--r2);background:var(--sup2);
  padding:9px 11px;font:inherit;font-size:12.5px;line-height:1.5;resize:vertical;
  transition:border-color var(--t);
}
.os-texto textarea:focus{outline:0;border-color:var(--azul);background:var(--sup)}
.os-ajuda{display:block;margin-top:4px;font-family:var(--mono);font-size:9px;color:var(--tenue)}
.os-lin{
  display:grid;grid-template-columns:130px 1fr 88px;gap:10px;align-items:baseline;
  padding:8px 13px 8px 26px;border-bottom:1px solid var(--linha);font-size:12px;
}
.os-lin:last-child{border-bottom:0}
.os-lin b{font-size:11px;color:var(--navy)}
.os-lin span{color:var(--txt);line-height:1.45}
.os-lin i{font-style:normal;font-size:10px;color:var(--tenue);text-align:right}

.imp-premissa{padding:10px 13px 10px 26px;font-size:12px;color:var(--txt);line-height:1.45;
  background:var(--sup2);border-bottom:1px solid var(--linha)}
.imp-premissa b{display:block;font-family:var(--mono);font-size:8.5px;color:var(--tenue);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.imp-tabela{padding:2px 13px 6px 26px}
.imp-lin{display:grid;grid-template-columns:1fr 120px 18px 120px;gap:8px;align-items:baseline;
  padding:7px 0;border-bottom:1px solid var(--linha);font-size:12px}
.imp-lin:last-child{border-bottom:0}
.imp-lin span{color:var(--txt)}
.imp-lin b{color:var(--fraco);font-weight:500}
.imp-lin i{font-style:normal;color:var(--tenue);text-align:center}
.imp-lin b.alvo{color:var(--tit);font-weight:600}
.imp-numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  padding:10px 13px 12px 26px}
.in{background:var(--sup2);border:1px solid var(--linha);border-radius:var(--r2);
  padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.in i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--tenue);
  text-transform:uppercase;letter-spacing:.08em}
.in b{font-size:17px;font-weight:600;color:var(--tit);letter-spacing:-.02em}
.in.forte{background:#F0F8F5;border-color:#CDE9DA}
.in.forte b{color:#14603D}
.imp-numeros.vazio .in b{color:var(--tenue)}
.imp-numeros.vazio .in.forte{background:var(--sup2);border-color:var(--linha)}
.imp-obs{margin:0 13px 12px 26px;font-size:11px;line-height:1.5;color:#8A5410;
  background:#FEF8F0;border:1px solid #F7DCBB;border-radius:var(--r2);padding:9px 11px}
.imp-obs b{display:block;font-family:var(--mono);font-size:8.5px;text-transform:uppercase;
  letter-spacing:.08em;color:#6F420B;margin-bottom:2px}
/* ==== 98-seek-radar.css ==== */
/* 98-seek-radar.css — o que o SEEK precisou a mais para morar no Comercial Radar
 * (13/09/2026): filtro por fonte, fila de 22 mil linhas, registro por fonte,
 * parecer da IA como fonte e a decisão em lote. Nada acima foi alterado. */

.hidden{display:none!important}
/* o sessao.js pendura o botão de perfil no body; aqui a pessoa sai pelo chip
 * "sair" e edita o perfil na tela de extração */
#btn-perfil{display:none!important}
a.chip{text-decoration:none}

/* ---- a fila: três recortes em lista e um por fonte, em pastilha ---- */
.fila-topo{gap:7px}
.fila-filtros .fl-sel + .fl-sel{margin-left:0}
.ffontes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
/* nome em cima, contagem embaixo: lado a lado, "DIRETÓRIO 3.123" não cabia
 * em um terço da fila e virava "DI…" */
.fch{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:4px;
  padding:3px 6px 3px 7px;min-width:0;text-align:left;
  border:1px solid var(--linha);border-radius:var(--r3);background:var(--sup2);
  font-family:var(--mono);font-size:9px;color:var(--fraco);letter-spacing:.02em;line-height:1.3;
  transition:border-color var(--t),background var(--t);
}
.fch:hover{border-color:var(--linha2)}
.fch span{grid-column:1;grid-row:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fch i{grid-column:2;grid-row:1;font-style:normal;font-size:9px;color:var(--tenue)}
.fch b{grid-column:1 / -1;grid-row:2;font-weight:600;color:var(--tenue);font-size:10px;
  font-variant-numeric:tabular-nums}
.fch[data-estado="sim"]{background:#E8F6EE;border-color:#9FD3B6;color:#14603D}
.fch[data-estado="sim"] i,.fch[data-estado="sim"] b{color:#14603D}
.fch[data-estado="nao"]{background:#FDF2F2;border-color:#EBB5B5;border-style:dashed;color:#A82F2F}
.fch[data-estado="nao"] i,.fch[data-estado="nao"] b{color:#A82F2F}
.ffontes-rot{display:flex;align-items:center;justify-content:space-between;margin-bottom:-3px}
.ffontes-rot .fl-rot{width:auto}
.ffontes-rot button{font-family:var(--mono);font-size:9px;color:var(--azul)}
.bt.lote{width:100%;height:30px;justify-content:space-between;padding:0 10px}
.bt.lote b{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}

/* 22 mil linhas não viram 22 mil botões: a lista desenha só a janela visível */
.fila-lista{position:relative}
.vl{position:relative}
.vl-jan{position:absolute;left:0;right:0;top:0;will-change:transform}
.fila-lista .fi{height:66px;overflow:hidden}
.fi .l3{display:flex;gap:6px}
.fi .l3 span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .l3 em{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--tenue);flex:none}
.fi .mini{display:flex;gap:2px;margin-left:auto;flex:none}
.fi .mini i{width:6px;height:6px;border-radius:2px;background:var(--linha)}
.fi .mini i.on{background:var(--mc)}
.dchip{
  font-family:var(--mono);font-size:8.5px;padding:1px 6px;border-radius:99px;
  color:var(--dc);border:1px solid color-mix(in srgb,var(--dc) 45%,transparent);
  background:color-mix(in srgb,var(--dc) 9%,var(--sup));white-space:nowrap;
}
.fila-pe{display:flex;align-items:center;gap:8px}
.fila-pe button{font-family:var(--mono);font-size:10px;color:var(--azul);margin-left:auto}

/* ---- a árvore: grupo · fonte · registro ---- */
.ramo.n-ia{--cc:#6D4AC7} .ramo.n-plataforma{--cc:#006DFF}
.ramo.n-oficial{--cc:#1F9D62} .ramo.n-olhar{--cc:#F28C28}
.reg{padding:9px 13px 10px 26px;border-top:1px solid var(--linha);background:var(--sup)}
.no-corpo > .reg:first-child{border-top:0}
.reg-cab{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.reg-cab b{font-size:12.5px;color:var(--tit);font-weight:600}
.reg-cab .poi{font-family:var(--mono);font-size:9.5px;color:var(--tenue)}
.reg.descartado{background:repeating-linear-gradient(135deg,var(--sup2) 0 6px,var(--sup) 6px 12px)}
.reg.descartado .reg-cab b{color:var(--fraco);font-weight:500}
.selo{font-family:var(--mono);font-size:9px;padding:1px 7px;border-radius:99px;white-space:nowrap;
  border:1px solid var(--linha);background:var(--sup3);color:var(--fraco)}
.selo.ok{background:#E8F6EE;border-color:#BFE3CE;color:#14603D}
.selo.nao{background:#FDECEC;border-color:#F3C9C9;color:#A82F2F}
.selo.alerta{background:#FEF3E5;border-color:#F7DCBB;color:#8A5410}
.selo.cinza{background:none;border-style:dashed;color:var(--tenue)}
.reg-por{font-size:11px;color:var(--fraco);margin-top:3px;line-height:1.45}
.reg-por b{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--tenue);font-weight:500;margin-right:5px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:5px 14px;margin-top:6px}
.kv > div{display:flex;flex-direction:column;min-width:0}
.kv i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--tenue);
  text-transform:uppercase;letter-spacing:.07em}
.kv b{font-size:12px;font-weight:500;color:var(--txt);overflow-wrap:anywhere;
  font-variant-numeric:tabular-nums}
.kv-caixa{padding:4px 13px 12px 26px}
.busca-txt{white-space:pre-wrap;font-family:var(--mono);font-size:11px;line-height:1.5;
  max-height:260px;overflow:auto;background:var(--sup2);border:1px solid var(--linha);
  border-radius:var(--r3);padding:8px 10px;margin-top:8px;color:var(--txt)}
.reg .bt.p{margin-top:8px}

/* o parecer da IA dentro da árvore */
.ia-txt{padding:11px 13px 10px 26px;font-size:12.5px;line-height:1.55;color:var(--tit)}
.ia-aviso{margin:0 13px 10px 26px;font-size:11.5px;line-height:1.5;color:#8A5410;
  background:#FEF8F0;border:1px solid #F7DCBB;border-radius:var(--r2);padding:8px 11px}
.ia-aviso > b:first-child{display:block;font-family:var(--mono);font-size:8.5px;
  text-transform:uppercase;letter-spacing:.08em;color:#6F420B;margin-bottom:2px}
.ia-lista{display:flex;flex-direction:column}
.ia-lin{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:baseline;
  padding:6px 13px 6px 26px;border-bottom:1px solid var(--linha);font-size:11.5px}
.ia-lin:last-child{border-bottom:0}
.ia-lin b{font-family:var(--mono);font-size:10.5px;color:var(--navy);font-weight:600}
.ia-lin span{color:var(--txt);line-height:1.45}
.ia-lin em{font-style:normal;font-weight:600;color:var(--tit)}
.mais{display:block;width:100%;text-align:left;padding:7px 13px 8px 26px;
  font-family:var(--mono);font-size:10px;color:var(--azul)}

/* o veredito da IA cabe em duas linhas; o texto inteiro está na árvore */
.par-texto{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- a decisão ---- */
.lk{font-size:11.5px;color:var(--azul);text-decoration:underline;text-underline-offset:2px}
.acao-opcoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.acao-op{border:1px solid var(--linha);border-radius:var(--r2);padding:9px 11px;text-align:left;
  background:var(--sup2);display:flex;flex-direction:column;gap:2px;transition:all var(--t)}
.acao-op:hover{border-color:var(--linha2)}
.acao-op.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset;background:var(--sup)}
.acao-op b{font-size:12.5px;color:var(--tit)}
.acao-op span{font-size:11px;color:var(--fraco);line-height:1.35}
.lote-resumo{background:var(--callout);border:1px solid #CFE0F7;border-radius:var(--r2);
  padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--navy);line-height:1.5}
.lote-resumo b{font-size:15px;font-variant-numeric:tabular-nums}
.lote-resumo ul{list-style:none;margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
.lote-resumo li{font-family:var(--mono);font-size:10px;background:var(--sup);border:1px solid #CFE0F7;
  border-radius:99px;padding:1px 8px}
.hist-lin{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--linha);font-size:12px}
.hist-lin:last-child{border-bottom:0}
.hist-lin i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--tenue)}
.hist-lin b{color:var(--tit)}
.hist-lin span{color:var(--fraco);display:block;font-size:11px}

/* ---- tela estreita (notebook, painel lateral) ----
 * Visto em 800 px no dia da estreia: os campos da faixa encolhiam até sumir
 * (o número da ligação não aparecia), chips e títulos quebravam em três linhas
 * e o texto do rodapé subia por cima do veredito. A regra: nada encolhe abaixo
 * do próprio conteúdo — o que não cabe rola ou sai de cena. */
.chip,.bt{white-space:nowrap;flex:none}
.no-crit .nm,.img-cab .nm,.arv-tit strong{white-space:nowrap}
.img-cab .res{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#faixa{overflow-x:auto;scrollbar-width:none}
#faixa::-webkit-scrollbar{display:none}
#faixa .cf{flex:none}
#faixa .cf b{max-width:34ch}
.dec-curadoria{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#decisao .acoes{min-width:0;overflow-x:auto}
.fila-pe span{white-space:nowrap}
.dec-estado b,.dec-estado span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arv-topo{gap:10px}
.arv-ferramentas{min-width:0;overflow-x:auto;scrollbar-width:none}
.arv-ferramentas::-webkit-scrollbar{display:none}
@media (max-width:1220px){
  #id-sub,#chip-rotulo,#arv-sub{display:none}
  #faixa .cf b{max-width:24ch}
}
@media (max-width:1000px){
  .dec-curadoria,#topo .quem span:last-child{display:none}
  .dec-estado{min-width:0;flex:0 1 auto}
  .dec-estado span{display:none}
  .arv-tit strong{display:none}
  #decisao{gap:10px}
}
</style>
</head>

<script>
/* ==== 20-cerebro-motor.js ==== */
/* 20-cerebro-motor.js — MOTOR CÉREBRO
 * Motor do padrão painel-evidencia-a2l · A2L. Serve o Cérebro do recadastro e
 * o portal de módulos — por isso não carrega nome de cliente.

          if (v0 > 0.48 || v0 < -0.48) { continue; }

          /* 2º corte: já com domínio deformado e relevo */
          deforma(x, y, z);
          d = mede(_wx, _wy, _wz);
          if (d > FAIXA_CASCA || d < -FAIXA_CASCA) { continue; }

          /* Newton: joga o candidato sobre a superfície do relevo. A normal
           * aponta para fora e d > 0 é dentro, então anda +d na normal. */
          for (k = 0; k < PASSOS_NEWTON; k++) {
            x += d * _nx * NEWTON_K;
            y += d * _ny * NEWTON_K;
            z += d * _nz * NEWTON_K;
            deforma(x, y, z);
            d = mede(_wx, _wy, _wz);
            if (!finito(d)) { break; }
          }
          if (!finito(d) || !finito(x) || !finito(y) || !finito(z)) { continue; }
          if (!finito(_nx) || !finito(_ny) || !finito(_nz)) { continue; }

          /* fundo de sulco fica rarefeito: numa nuvem esparsa o giro só é
           * legível se o sulco virar canal vazio, não só ponto escuro */
          corte = trava(divSegura(_ao - CORTE_SULCO_A, CORTE_SULCO_B), 0, 1);
          if (rnd() < corte * corte * (3 - 2 * corte) * 0.92) { continue; }

          brutos.push([x, y, z, _nx, _ny, _nz, _ao, rnd()]);

     * uniforme — é o que a miniatura usa. */
    brutos.sort(function (a, b) { return a[7] - b[7]; });
    var n = Math.min(brutos.length, MAX_PONTOS);

    var px = new Float32Array(n), py = new Float32Array(n), pz = new Float32Array(n);
    var nx = new Float32Array(n), ny = new Float32Array(n), nz = new Float32Array(n);
    var ao = new Float32Array(n);
    var i, b;
    for (i = 0; i < n; i++) {
      b = brutos[i];
      px[i] = b[0]; py[i] = b[1]; pz[i] = b[2];
      nx[i] = b[3]; ny[i] = b[4]; nz[i] = b[5];
      ao[i] = b[6];
    }

    GEO = {n: n, px: px, py: py, pz: pz, nx: nx, ny: ny, nz: nz, ao: ao};
    construirMalha(GEO);
    return GEO;
  }

  /* malha por grade espacial: célula = raio de busca, varre 27 células.
   * Nunca guarda todos os pares — isso passaria no terminal e travaria o
   * navegador. */
  function construirMalha(g) {
    var n = g.n, raio = RAIO_MALHA, r2 = raio * raio;
    var i, j, k, c;

    var x1 = 1e9, y1 = 1e9, z1 = 1e9, x2 = -1e9, y2 = -1e9, z2 = -1e9;
    for (i = 0; i < n; i++) {
      if (g.px[i] < x1) { x1 = g.px[i]; } if (g.px[i] > x2) { x2 = g.px[i]; }
      if (g.py[i] < y1) { y1 = g.py[i]; } if (g.py[i] > y2) { y2 = g.py[i]; }
      if (g.pz[i] < z1) { z1 = g.pz[i]; } if (g.pz[i] > z2) { z2 = g.pz[i]; }
    }
    if (n === 0) { x1 = y1 = z1 = 0; x2 = y2 = z2 = 1; }

    var gx = Math.max(1, Math.ceil(divSegura(x2 - x1, raio)) + 1);
    var gy = Math.max(1, Math.ceil(divSegura(y2 - y1, raio)) + 1);
    var gz = Math.max(1, Math.ceil(divSegura(z2 - z1, raio)) + 1);
    var invR = divSegura(1, raio);

    var cabeca = new Int32Array(gx * gy * gz);
    var prox = new Int32Array(n);
    for (i = 0; i < cabeca.length; i++) { cabeca[i] = -1; }

    var cx = new Int32Array(n), cy = new Int32Array(n), cz = new Int32Array(n);
    for (i = 0; i < n; i++) {
      cx[i] = trava(Math.floor((g.px[i] - x1) * invR), 0, gx - 1);
      cy[i] = trava(Math.floor((g.py[i] - y1) * invR), 0, gy - 1);
      cz[i] = trava(Math.floor((g.pz[i] - z1) * invR), 0, gz - 1);
      c = (cz[i] * gy + cy[i]) * gx + cx[i];
      prox[i] = cabeca[c];
      cabeca[c] = i;
    }

    var K = VIZ_POR_PONTO;
    var viz = new Int32Array(n * K);
    var dist = new Float64Array(K);
    var ax, ay, az, bx, by, bz, dd, p, q, t, ci, cj, ck, i0, j0, k0;
    for (i = 0; i < n * K; i++) { viz[i] = -1; }

    for (i = 0; i < n; i++) {
      for (q = 0; q < K; q++) { dist[q] = 1e9; }
      ax = g.px[i]; ay = g.py[i]; az = g.pz[i];
      for (k0 = cz[i] - 1; k0 <= cz[i] + 1; k0++) {
        if (k0 < 0 || k0 >= gz) { continue; }
        for (j0 = cy[i] - 1; j0 <= cy[i] + 1; j0++) {
          if (j0 < 0 || j0 >= gy) { continue; }
          for (i0 = cx[i] - 1; i0 <= cx[i] + 1; i0++) {
            if (i0 < 0 || i0 >= gx) { continue; }
            j = cabeca[(k0 * gy + j0) * gx + i0];
            while (j !== -1) {
              if (j !== i) {
                bx = g.px[j] - ax; by = g.py[j] - ay; bz = g.pz[j] - az;
                dd = bx * bx + by * by + bz * bz;
                if (dd < r2) {
                  /* insere ordenado nos K melhores */
                  for (q = 0; q < K; q++) {
                    if (dd < dist[q]) {
                      for (t = K - 1; t > q; t--) {
                        dist[t] = dist[t - 1]; viz[i * K + t] = viz[i * K + t - 1];
                      }
                      dist[q] = dd; viz[i * K + q] = j;
                      break;
                    }
                  }
                }
              }
              j = prox[j];
            }
          }
        }
      }
    }

    /* deduplica sem Set: só aceita (i,j) com j > i, ou j < i quando i não
     * está na lista de j */
    var ar = [];
    var repetido;
    for (i = 0; i < n && ar.length < MAX_ARESTAS * 2; i++) {
      for (q = 0; q < K; q++) {
        j = viz[i * K + q];
        if (j < 0) { continue; }
        if (j < i) {
          repetido = false;
          for (t = 0; t < K; t++) { if (viz[j * K + t] === i) { repetido = true; } }
          if (repetido) { continue; }
        }
        ar.push(i); ar.push(j);
      }
    }

    var arestas = new Int32Array(ar.length);
    for (i = 0; i < ar.length; i++) { arestas[i] = ar[i]; }
    g.arestas = arestas;
    g.nArestas = arestas.length >> 1;
  }

  /* ======================================================================
   * 6. COR
   * ==================================================================== */

  function hexRgb(h) {
    var s = (typeof h === 'string' ? h : '').replace('#', '');
    if (s.length === 3) { s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2]; }
    if (s.length !== 6) { return [107, 118, 132]; }
    var v = parseInt(s, 16);
    if (!finito(v)) { return [107, 118, 132]; }
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function misturaRgb(a, b, t) {
    var k = trava(t, 0, 1);
    return [
      Math.round(a[0] + (b[0] - a[0]) * k),
      Math.round(a[1] + (b[1] - a[1]) * k),
      Math.round(a[2] + (b[2] - a[2]) * k)
    ];
  }

  function rgbTexto(c) {
    return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  }

  function rgbaTexto(c, a) {
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + trava(a, 0, 1).toFixed(3) + ')';
  }

  /* ======================================================================
   * 7. INSTÂNCIA
   * ==================================================================== */

  function apiInerte() {
    return {
      quadro: function () {},
      cobertura: function () {},
      destaca: function () {},
      miniatura: function () {},
      redimensiona: function () {},
      estatisticas: function () { return {pontos: 0, linhas: 0, arestasDesenhadas: 0, nan: 0}; },
      destroi: function () {}
    };
  }

  function cria(canvas, opcoes) {
    var op = opcoes || {};
    var ctx = (canvas && canvas.getContext) ? canvas.getContext('2d') : null;
    if (!ctx) { return apiInerte(); }

    var g = geraGeometria();
    var n = g.n;
    if (!n) { return apiInerte(); }

    /* ------------------------------------------------ áreas e centros -- */
    var areas = [];
    var fonte = (op.areas && op.areas.length) ? op.areas : AREAS_PADRAO;
    var i, j, k, a, c;
    for (i = 0; i < fonte.length; i++) {
      a = fonte[i] || {};
      c = a.centro;
      if (!(c && c.length === 3 && finito(+c[0]) && finito(+c[1]) && finito(+c[2]))) {
        c = (AREAS_PADRAO[i % AREAS_PADRAO.length]).centro;
      }
      areas.push({
        id: (a.id === undefined || a.id === null) ? ('area' + i) : a.id,
        nome: a.nome || '',
        rgb: hexRgb(a.cor || AREAS_PADRAO[i % AREAS_PADRAO.length].cor),
        cx: +c[0], cy: +c[1], cz: +c[2]

    }
    var nAreas = areas.length;

    /* centros vindos de fora chegam em qualquer escala: normaliza a caixa
     * deles para a caixa interna do cérebro, eixo a eixo. */
    (function () {
      var x1 = 1e9, y1 = 1e9, z1 = 1e9, x2 = -1e9, y2 = -1e9, z2 = -1e9, q;
      for (q = 0; q < nAreas; q++) {
        if (areas[q].cx < x1) { x1 = areas[q].cx; } if (areas[q].cx > x2) { x2 = areas[q].cx; }
        if (areas[q].cy < y1) { y1 = areas[q].cy; } if (areas[q].cy > y2) { y2 = areas[q].cy; }
        if (areas[q].cz < z1) { z1 = areas[q].cz; } if (areas[q].cz > z2) { z2 = areas[q].cz; }
      }
      var ex = x2 - x1, ey = y2 - y1, ez = z2 - z1;
      for (q = 0; q < nAreas; q++) {
        areas[q].cx = ex > 1e-6 ? CX1 + divSegura(areas[q].cx - x1, ex) * (CX2 - CX1) : (CX1 + CX2) * 0.5;
        areas[q].cy = ey > 1e-6 ? CY1 + divSegura(areas[q].cy - y1, ey) * (CY2 - CY1) : (CY1 + CY2) * 0.5;
        areas[q].cz = ez > 1e-6 ? CZ1 + divSegura(areas[q].cz - z1, ez) * (CZ2 - CZ1) : (CZ1 + CZ2) * 0.5;

    var melhor, dmin, dx, dy, dz, dd;

        dd = dx * dx + dy * dy + dz * dz;

    var nArestas = g.nArestas;
    var arCor = new Int16Array(nArestas);   /* -1 = aresta neutra (entre áreas) */
    for (i = 0; i < nArestas; i++) {
      j = g.arestas[i * 2]; k = g.arestas[i * 2 + 1];

    }

    /* ------------------------------------------------------- estado --- */
    var IDX_SEM = nAreas;            /* sem registro */
    var IDX_APAGADO = nAreas + 1;    /* apagado por causa de um destaque */
    var NCORES = nAreas + 2;
    var NBALDES = NFATIAS * NCORES * NIVEIS;

    var coberturas = [];
    for (i = 0; i < nAreas; i++) { coberturas.push(null); }
    var media = 0;

    var areaParaCor = new Int32Array(nAreas);
    var paleta = new Array(NFATIAS * NCORES * NIVEIS);
    var raios = new Float64Array(NFATIAS * NCORES * NIVEIS);
    var paletaLinha = new Array(NCORES + 1);

    /* `velocidade` multiplica o giro automático (1 = o de sempre; 0 = parado);
     * `rotulos` desenha a identificação de cada área em cima do volume, e ela
     * fica — sem depender de o ponteiro estar em cima. */
    var velGiro = (typeof op.velocidade === 'number' && finito(op.velocidade))
      ? trava(op.velocidade, 0, 4) : 1;
    var comRotulos = !!op.rotulos;
    var rotX = new Float64Array(nAreas), rotY = new Float64Array(nAreas);
    var rotN = new Int32Array(nAreas);

    var largura = 1, altura = 1, dpr = 1;
    var anguloX = 0.15, anguloY = 0.70;   /* obliquo: mostra volume e giros; medido no banco de testes */
    var zoom = 1;
    var escalaBase = 100, escalaFinal = 100;
    var projCx = 0, projCy = 0, centroX = 0, centroY = 0;
    var alvoEsc = 100, alvoCx = 0, alvoCy = 0, pitchMedido = 9;
    var ultimoT = 0, pausaAte = 0;
    var mini = false, destaque = -1, nDesenho = n;
    var pontoPx = 1.4;

    var sxA = new Float32Array(n), syA = new Float32Array(n);
    var pTz = new Float32Array(n), pFat = new Uint8Array(n);
    var pNiv = new Uint8Array(n), pVis = new Uint8Array(n);

    var baldes = new Array(NBALDES);
    for (i = 0; i < NBALDES; i++) { baldes[i] = []; }
    var baldesLinha = new Array(NCORES + 1);
    for (i = 0; i <= NCORES; i++) { baldesLinha[i] = []; }

    var estat = {pontos: 0, linhas: nArestas, arestasDesenhadas: 0, nan: 0};

    var RGB_FUNDO = hexRgb(COR_FUNDO_BORDA);
    var RGB_CINZA = hexRgb(COR_CINZA);
    var RGB_NAVY = hexRgb(COR_NAVY);
    var RGB_SOMBRA = hexRgb(COR_SOMBRA);
    var RGB_BRANCO = [255, 255, 255];

    /* ------------------------------------------------- paleta e raios -- */
    function atualizaVisual() {
      var q, nv, fa, cov, base, escuro, claro, luz, forca, fatCor, alvo;
      var soma = 0, conta = 0;

      for (q = 0; q < nAreas; q++) {
        cov = coberturas[q];
        if (cov === null) { areaParaCor[q] = IDX_SEM; }
        else {
          soma += cov; conta++;
          areaParaCor[q] = (destaque >= 0 && destaque !== q) ? IDX_APAGADO : q;
        }
      }
      media = conta > 0 ? divSegura(soma, conta) : 0;

      for (q = 0; q < NCORES; q++) {
        if (q < nAreas) {
          cov = coberturas[q];
          forca = (cov === null) ? 0 : 0.16 + 0.84 * trava(cov, 0, 1);
          base = misturaRgb(RGB_CINZA, areas[q].rgb, forca);
          if (destaque === q) { base = misturaRgb(base, areas[q].rgb, 0.5); }
          /* Camada sem registro fica CINZA — a cor já diz que não há dado.
           * O tamanho não precisa dizer de novo: encolher o ponto apagava um
           * quarto da silhueta (cerebelo e temporal saíam da forma) e a peça
           * parecia quebrada em vez de incompleta. Cinza, mas presente. */
          fatCor = (cov === null) ? 0.94 : (0.62 + 0.58 * trava(cov, 0, 1));
          if (destaque === q) { fatCor *= 1.30; }
        } else if (q === IDX_SEM) {
          base = misturaRgb(RGB_CINZA, RGB_FUNDO, 0.40);
          fatCor = 0.54;
        } else {
          base = misturaRgb(RGB_CINZA, RGB_FUNDO, 0.66);
          fatCor = 0.52;
        }

        escuro = misturaRgb(base, RGB_SOMBRA, 0.40);
        claro = misturaRgb(base, RGB_BRANCO, 0.32);
        for (nv = 0; nv < NIVEIS; nv++) {
          luz = nv === 0 ? escuro
              : nv === 1 ? misturaRgb(base, escuro, 0.55)
              : nv === 2 ? base
              : nv === 3 ? misturaRgb(base, claro, 0.50)
              : claro;
          for (fa = 0; fa < NFATIAS; fa++) {
            paleta[(fa * NCORES + q) * NIVEIS + nv] =
              rgbTexto(misturaRgb(luz, RGB_FUNDO, MIST_FATIA[fa]));
            alvo = pontoPx * fatCor * FAT_NIVEL[nv] * FAT_FATIA[fa];
            raios[(fa * NCORES + q) * NIVEIS + nv] = Math.max(0.4, alvo);
          }
        }

        /* linha da malha: herda a cor da área, bem discreta */
        if (q < nAreas) {
          cov = coberturas[q];
          paletaLinha[q] = rgbaTexto(areas[q].rgb,
            (cov === null) ? 0.06 : (0.14 + 0.30 * trava(cov, 0, 1)) * (destaque >= 0 && destaque !== q ? 0.25 : 1));
        } else if (q === IDX_SEM) {
          paletaLinha[q] = rgbaTexto(RGB_CINZA, 0.05);
        } else {
          paletaLinha[q] = rgbaTexto(RGB_CINZA, 0.04);
        }
      }
      paletaLinha[NCORES] = rgbaTexto(RGB_NAVY, destaque >= 0 ? 0.05 : 0.105);
    }

    function atualizaPonto() {
      var util = largura * altura * 0.42;
      pontoPx = trava(Math.sqrt(divSegura(util, Math.max(1, nDesenho))) * 0.58, 0.6, 4.6);
    }

    /* --------------------------------------------- enquadramento medido -
     * Projeta uma amostra dos pontos em 8 guinadas, na inclinação pedida, e
     * usa a bbox REAL do resultado. A guinada inteira entra porque o cérebro
     * gira sozinho — assim a escala não pula de quadro em quadro. A
     * inclinação muda só quando o usuário arrasta, e aí o alvo é perseguido
     * suavemente. Nenhuma escala chutada.
     */
    function enquadra(pitch, imediato) {
      var passo = Math.max(1, Math.floor(n / 900));
      var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
      var q, ia, ay, cy0, sy0, cx0, sx0, xx, yy, zz, x1r, z1r, y2r, z2r, den, f;

      cx0 = Math.cos(pitch); sx0 = Math.sin(pitch);
      for (ia = 0; ia < 8; ia++) {
        ay = ia * TAU / 8;
        cy0 = Math.cos(ay); sy0 = Math.sin(ay);
        for (q = 0; q < n; q += passo) {
          xx = g.px[q]; yy = g.py[q]; zz = g.pz[q];
          x1r = xx * cy0 + zz * sy0;
          z1r = -xx * sy0 + zz * cy0;
          y2r = yy * cx0 - z1r * sx0;
          z2r = yy * sx0 + z1r * cx0;
          den = DIST_CAM - z2r;
          if (den < 0.35) { den = 0.35; }
          f = divSegura(FOCO, den);
          xx = x1r * f; yy = y2r * f;
          if (xx < x1) { x1 = xx; } if (xx > x2) { x2 = xx; }
          if (yy < y1) { y1 = yy; } if (yy > y2) { y2 = yy; }
        }
      }
      if (!(x2 > x1)) { x1 = -0.1; x2 = 0.1; }
      if (!(y2 > y1)) { y1 = -0.1; y2 = 0.1; }

      var ex = divSegura(largura * (1 - 2 * MARGEM), x2 - x1);
      var ey = divSegura(altura * (1 - 2 * MARGEM), y2 - y1);
      alvoEsc = Math.min(ex, ey);
      if (!(alvoEsc > 0)) { alvoEsc = Math.min(largura, altura) * 0.35; }
      alvoCx = (x1 + x2) * 0.5;
      alvoCy = (y1 + y2) * 0.5;

      if (imediato) { escalaBase = alvoEsc; projCx = alvoCx; projCy = alvoCy; }
    }

    function redimensiona() {
      var cw = canvas.clientWidth || canvas.width || 320;
      var ch = canvas.clientHeight || canvas.height || 240;
      largura = Math.max(1, Math.round(cw));
      altura = Math.max(1, Math.round(ch));
      dpr = 1;
      if (typeof raiz !== 'undefined' && raiz && finito(raiz.devicePixelRatio)) {
        dpr = trava(raiz.devicePixelRatio, 1, 3);
      }
      canvas.width = Math.max(1, Math.round(largura * dpr));
      canvas.height = Math.max(1, Math.round(altura * dpr));

    /* ------------------------------------------------------- desenho --- */
    function fundo() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, largura, altura);
      var r = Math.max(largura, altura) * 0.72;
      var gr = ctx.createRadialGradient(largura * 0.5, altura * 0.44, 0,

      gr.addColorStop(0, COR_FUNDO_CENTRO);
      gr.addColorStop(1, COR_FUNDO_BORDA);
      ctx.fillStyle = gr;
      ctx.fillRect(0, 0, largura, altura);

      /* halo: intensidade = média das camadas COM registro (null não conta) */
      if (media > 0.02) {
        var raioH = Math.min(largura, altura) * (0.30 + 0.16 * media);
        var gh = ctx.createRadialGradient(centroX, centroY, 0, centroX, centroY,
                                          raioH > 0 ? raioH : 1);
        gh.addColorStop(0, rgbaTexto(hexRgb('#006DFF'), 0.10 * media));
        gh.addColorStop(1, rgbaTexto(hexRgb('#006DFF'), 0));

        ctx.fillRect(0, 0, largura, altura);
      }
    }

    function desenhaPasse(f0, f1) {
      var fa, nv, co, b, idx, r, q, ch;
      for (fa = f0; fa < f1; fa++) {
        ctx.globalAlpha = ALFA_FATIA[fa];
        for (nv = 0; nv < NIVEIS; nv++) {
          for (co = 0; co < NCORES; co++) {
            ch = (fa * NCORES + co) * NIVEIS + nv;
            b = baldes[ch];
            if (!b.length) { continue; }
            r = raios[ch];
            ctx.fillStyle = paleta[ch];
            ctx.beginPath();
            for (q = 0; q < b.length; q++) {
              idx = b[q];
