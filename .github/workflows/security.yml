name: Segurança

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # Segunda, 06:00 UTC. Dependência não fica insegura quando você mexe nela —
    # fica insegura quando alguém publica o CVE, num dia em que você não mexeu.
    - cron: '0 6 * * 1'

concurrency:
  group: sec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: gitleaks — segredo no diff e no histórico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico inteiro: segredo antigo continua sendo segredo

      # Binário direto, e não `gitleaks/gitleaks-action@v2`.
      #
      # A ação falhava com HTTP 403 em `GET /repos/.../pulls/1/commits` — nem
      # chegava a varrer nada. Ela precisa de permissão de leitura no PR e, em
      # conta de organização, de licença paga. Trocar isso por um binário
      # elimina os dois problemas e traz uma propriedade melhor: **o comando do
      # CI é o mesmo que roda no pre-commit e na máquina de quem desenvolve**.
      # Quando o CI reprovar, dá para reproduzir localmente em um comando.
      - name: Instalar gitleaks
        run: |
          VERSAO=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Varrer o histórico inteiro
        run: gitleaks git . --log-opts=--all -c .gitleaks.toml --redact --no-banner

  dependencias:
    name: Dependências com CVE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: pip-audit
        run: |
          pip install pip-audit
          # `|| true` de propósito: CVE em dependência transitiva não deve
          # travar o PR de quem não a introduziu. O relatório fica no log e
          # vira issue; travar aqui só ensina a ignorar o CI.
          pip-audit -r requirements.txt --desc || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --audit-level=high || true

  # ── CodeQL: removido, e o motivo importa ──────────────────────────────────
  # Ele analisou o código sem erro, mas falhou ao publicar o resultado:
  # "Code scanning is not enabled for this repository". Em repositório PRIVADO,
  # publicar exige GitHub Advanced Security, que é pago — e eu tinha posto o job
  # sem verificar isso, então a esteira nascia vermelha.
  #
  # Para reativar: habilite o Advanced Security em Settings → Code security,
  # e devolva o job abaixo.
  #
  #   codeql:
  #     name: CodeQL
  #     runs-on: ubuntu-latest
  #     permissions: { security-events: write, contents: read }
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: github/codeql-action/init@v3
  #         with: { languages: python, javascript-typescript }
  #       - uses: github/codeql-action/analyze@v3
  #
  # Enquanto não houver, o `pip-audit`, o `npm audit` e o gitleaks acima seguem
  # cobrindo dependência vulnerável e segredo, que é o que mais aparece aqui.
