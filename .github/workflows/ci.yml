name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Um PR que recebe push novo cancela a execução anterior: fila de CI parada em
# revisão obsoleta é minuto de runner gasto para nada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — sintaxe e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # a versão do venv do projeto

      - name: Compila tudo
        # Não há suíte de testes ainda (checklist req. 9). Compilar pega o erro
        # de sintaxe, que é o que mais some num arquivo de 1.800 linhas.
        run: python -m compileall -q . -x '(\.venv|node_modules|__pycache__)'

      - name: Ruff — só o que está quebrado
        # `--select=E9,F63,F7,F82` é o conjunto de erro REAL: sintaxe inválida,
        # nome indefinido, comparação sempre falsa, f-string malformada. Coisas
        # que quebram em execução.
        #
        # A versão anterior rodava o ruff inteiro e reprovou o PR por estilo em
        # arquivo de 2026-04 que ninguém tocou — `try/except/pass`, import fora
        # de ordem, `Optional` implícito. Portão que nasce reprovando código
        # antigo não protege nada: ensina a equipe a passar por cima do CI.
        #
        # A limpeza de estilo é tarefa própria, com PR próprio. Quando ela
        # acontecer, este `--select` sai e o ruff passa a valer inteiro.
        run: |
          pip install ruff
          ruff check . --exclude .venv,.venv-coletivo,node_modules,skills \
                       --select=E9,F63,F7,F82 --output-format=github

  contratos:
    name: Contratos das skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validador da skill de fachada
        # O runner LÊ os enums e as regras destes arquivos. Se a skill quebrar,
        # toda anotação é reprovada em produção — e a falha aparece só no lote.
        run: |
          pip install jsonschema
          python skills/leitura-fachada-cadastral/tests/selftest.py

  estado:
    name: Painel — estado.json válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/painel.mjs --check
