<style>

.pp-hd{flex:1}.pp-badge{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}.pp-badge.al{color:var(--al)}.pp-badge.md{color:var(--md)}.pp-badge.bx{color:var(--bx)}.pp-badge.st{color:#0ea5e9}.pp-badge.nt{color:var(--mt)}.pp-sub{font-size:9px;color:var(--dm);margin-top:1px;font-weight:500}

.pp-lk{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:8px;background:rgba(34,211,238,.06);color:var(--ac);font-size:10px;font-weight:600;text-decoration:none;border:1px solid rgba(34,211,238,.12);transition:all .2s;letter-spacing:.2px}.pp-lk:hover{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.25)}.pp-lk svg{width:13px;height:13px;flex-shrink:0}
.leaflet-control-layers{border-radius:10px!important;border:1px solid var(--bd)!important;background:var(--sf)!important;color:var(--tx2)!important;box-shadow:0 4px 20px rgba(0,0,0,.3)!important;font-family:'Plus Jakarta Sans'!important;font-size:11px!important}

</style>

<script>
const D=__DATA_PLACEHOLDER__;
const C3=['ALTA','MEDIA','BAIXA'],CL={ALTA:'#10b981',MEDIA:'#f59e0b',BAIXA:'#f43f5e'},CN={ALTA:'Alta Confiança',MEDIA:'Média Confiança',BAIXA:'Baixa Confiança'},CC={ALTA:'al',MEDIA:'md',BAIXA:'bx'};
const TL={COND_VERT_MULTIBLOCOS:'Cond. Vert. Multi-Blocos',COND_HORIZ_MULTIBLOCOS:'Cond. Horiz. Multi-Blocos',COND_MULTIBLOCOS:'Cond. Multi-Blocos',COND_VIA_INT:'Cond. Via Interna',EMPREEND_NOMEADO:'Empreend. Nomeado',VERT_APTO:'Edif. Apartamentos',VERT_COMPL:'Edif. Unidades',VERT_BLOCO:'Edif. Blocos',HORIZ_VILA_COND:'Vila/Cond. Horizontal',HORIZ_MORADIAS:'Múltiplas Moradias',HORIZ_SUBDIV:'Subdivisão Horizontal',MULT_ESTAB:'Múlt. Estabelecimentos',AGRUP_END:'Agrupamento Endereço',APTO_ISOLADO:'Apto Isolado',AGRUP_TEXTO:'Agrup. Textual',DUPLA_END:'Dupla Endereço'};
const SC={ALIMENTACAO:['#f97316','Alimentação'],INDUSTRIAL:['#ef4444','Industrial'],COMERCIO_VAREJO:['#eab308','Com. Varejo'],COMERCIO_SERVICO:['#d4a017','Com./Serviço'],SERVICO_PROF:['#22c55e','Serv. Profissional'],SERVICO_AUTO:['#16a34a','Serv. Automotivo'],MANUFATURA:['#a855f7','Manufatura'],BELEZA_ESTETICA:['#ec4899','Beleza/Estética'],SAUDE:['#3b82f6','Saúde'],EDUCACAO:['#6366f1','Educação'],RELIGIOSO:['#8b5cf6','Religioso'],HOSPEDAGEM:['#f97316','Hospedagem'],VAGO:['#64748b','Vago'],AGROPECUARIO:['#22c55e','Agropecuário'],LAZER:['#14b8a6','Lazer'],ASSOCIACAO_ONG:['#e11d48','Assoc./ONG'],DIVERSOS:['#6b7280','Diversos'],DOMICILIO_COLETIVO:['#8b5cf6','Dom. Coletivo']};
const NV={1:['#10b981','NV1 Original'],2:['#34d399','NV2 Ajustada'],3:['#f59e0b','NV3 Estimada'],4:['#f43f5e','NV4 Face Quadra'],5:['#dc2626','NV5 Localidade'],6:['#991b1b','NV6 Setor']};
const dark=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19});const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19});const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
const map=L.map('map',{center:[-27.6617,-48.6683],zoom:13,layers:[dark],preferCanvas:true,zoomControl:false});L.control.zoom({position:'topright'}).addTo(map);L.control.layers({'Escuro':dark,'Ruas':streets,'Satélite':sat},{},{position:'topright',collapsed:true}).addTo(map);
let tab='col',lys=[],F={};
const sv=(a,o)=>`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${a},${o}`;

const ig=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>`;
const isat=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/><circle cx="12" cy="12" r="3" fill="currentColor" opacity=".3"/></svg>`;
const ib=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 9h.01M15 9h.01"/></svg>`;
const is=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path d="M9 22V12h6v10"/></svg>`;
const ip=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
const lks=(a,o)=>`<a class="pp-lk" href="${sv(a,o)}" target="_blank">${ig} Google Street View</a><a class="pp-lk" href="${gsat(a,o)}" target="_blank" style="margin-top:6px;background:rgba(16,185,129,.06);color:#34d399;border-color:rgba(16,185,129,.12)">${isat} Google Maps Satélite</a>`;
function bld(t){const p=document.getElementById('pnl');p.innerHTML='';F={};if(t==='col'){p.innerHTML+='<div class="pt">Confiança</div>';C3.forEach(c=>{F['c_'+c]=true;const n=D.c.filter(r=>C3[r[19]]===c).length;p.innerHTML+=`<div class="fr" onclick="tf('c_${c}')"><div class="ck on" id="f_c_${c}"></div><div class="dt" style="background:${CL[c]}"></div><div class="lb">${CN[c]}</div><div class="ct">${n.toLocaleString()}</div></div>`});p.innerHTML+='<div class="sep"></div><div class="pt">Classificação</div>';const tc={};D.c.forEach(r=>{const k=D.t[r[20]]||'';if(k)tc[k]=(tc[k]||0)+1});D.t.forEach(t=>{if(!tc[t])return;F['t_'+t]=true;p.innerHTML+=`<div class="fr" onclick="tf('t_${t}')"><div class="ck on" id="f_t_${t}"></div><div class="lb">${TL[t]||t}</div><div class="ct">${tc[t].toLocaleString()}</div></div>`})}else if(t==='nres'){p.innerHTML+='<div class="pt">Setor de Atividade</div>';const sc={};D.n.forEach(r=>{const k=D.s[r[5]]||'';if(k)sc[k]=(sc[k]||0)+1});D.s.forEach(s=>{if(!sc[s])return;F['s_'+s]=true;const i=SC[s]||['#6b7280',s];p.innerHTML+=`<div class="fr" onclick="tf('s_${s}')"><div class="ck on" id="f_s_${s}"></div><div class="dt" style="background:${i[0]}"></div><div class="lb">${i[1]}</div><div class="ct">${sc[s].toLocaleString()}</div></div>`})}else{p.innerHTML+='<div class="pt">Situação</div>';const nc=D.a.filter(r=>r[7]===1).length,ni=D.a.filter(r=>r[7]===0).length;F.sc=true;F.si=true;p.innerHTML+=`<div class="fr" onclick="tf('sc')"><div class="ck on" id="f_sc"></div><div class="dt" style="background:#0ea5e9"></div><div class="lb">Coletivas</div><div class="ct">${nc.toLocaleString()}</div></div><div class="fr" onclick="tf('si')"><div class="ck on" id="f_si"></div><div class="dt" style="background:#ef4444"></div><div class="lb">Individuais</div><div class="ct">${ni.toLocaleString()}</div></div><div class="sep"></div><div class="pt">Precisão Coordenada</div>`;const nvc={};D.a.forEach(r=>{nvc[r[6]]=(nvc[r[6]]||0)+1});[1,2,3,4,5,6].forEach(v=>{if(!nvc[v])return;F['v_'+v]=true;const i=NV[v];p.innerHTML+=`<div class="fr" onclick="tf('v_${v}')"><div class="ck on" id="f_v_${v}"></div><div class="dt" style="background:${i[0]}"></div><div class="lb">${i[1]}</div><div class="ct">${nvc[v].toLocaleString()}</div></div>`})}}
function tf(k){F[k]=!F[k];const e=document.getElementById('f_'+k);if(e)e.classList.toggle('on');draw()}
function clr(){lys.forEach(l=>map.removeLayer(l));lys=[]}
function draw(){clr();let n=0;if(tab==='col'){D.c.forEach(r=>{const c=C3[r[19]],t=D.t[r[20]]||'';if(!c||!F['c_'+c])return;if(t&&!F['t_'+t])return;const cl=CL[c],rd=Math.min(3+Math.sqrt(r[7])*1.3,14);const m=L.circleMarker([r[0],r[1]],{radius:rd,color:cl,fillColor:cl,fillOpacity:.55,weight:1.5,opacity:.8});m.on('click',()=>pC(r));m.addTo(map);lys.push(m);n++})}else if(tab==='nres'){D.n.forEach(r=>{const s=D.s[r[5]]||'';if(!F['s_'+s])return;const cl=(SC[s]||['#6b7280'])[0];const m=L.circleMarker([r[0],r[1]],{radius:4.5,color:cl,fillColor:cl,fillOpacity:.65,weight:1,opacity:.8});m.on('click',()=>pN(r));m.addTo(map);lys.push(m);n++})}else{D.a.forEach(r=>{const ic=r[7]===1;if(ic&&!F.sc)return;if(!ic&&!F.si)return;if(!F['v_'+r[6]])return;const cl=ic?(CL[C3[r[8]]]||'#0ea5e9'):'#ef4444';const rd=ic?Math.min(2.5+Math.sqrt(r[2])*.7,9):3.5;const m=L.circleMarker([r[0],r[1]],{radius:rd,color:cl,fillColor:cl,fillOpacity:ic?.5:.55,weight:ic?1:.8,opacity:.75});m.on('click',()=>pA(r));m.addTo(map);lys.push(m);n++})}document.getElementById('vn').textContent=n.toLocaleString()}
