# API do Radar Comercial — porta 7740 (bloco de APIs próprias, doc 17).
#
# ERA 7720 ATÉ 02/09/2026, e a 7720 tem dono: o `api-bases`. Como este
# contêiner nunca chegou a subir, o choque nunca apareceu — teria vindo
# como "port is already allocated", que aponta para o Docker e não para
# a escolha de porta. 7740 é a primeira livre do bloco.
#
#   docker compose -f compose.radar-comercial-api.yml up -d --build
#
# ESTE CONTÊINER NÃO MINERA. Ele serve HTTP, WebSocket e fala com o banco; a
# mineração vive no `compose.radar-comercial-minerador.yml`, que sobe dez
# Chromium e por isso não cabe no molde de segurança da stack.
#
# A separação foi decidida em 30/08/2026 e tem consequência de código: a API
# deixou de dar `Popen` no `minerar_tudo.py` e passou a ENFILEIRAR o trabalho
# numa tabela. Quem consome é o minerador. Sem isso, os dois contêineres
# precisariam compartilhar espaço de processos, que é o mesmo que não separar.

name: radar-comercial-api

services:
  radar-comercial-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: radar-comercial-api
    restart: unless-stopped

    env_file:
      - ../.env          # A2L_DB_URL, chaves do Google, HF_TOKEN — chmod 600

    environment:
      # A API usa a 7110 (transação): muitas conexões curtas, uma transação por
      # requisição. O pipeline é que usa a 7100 — ver o compose do minerador.
      PORTA_API: 7740
      PYTHONUNBUFFERED: "1"
      # Sem isto o `chat_api` calcula a pasta com `Path.home()`, tenta criar em
      # /home/radar no import, e o contêiner read-only derruba a API inteira.
      ANEXOS_DIR: /app/anexos
      # O `.env` aponta o pooler em 127.0.0.1:7100 — o loopback do HOST. Numa
      # rede-ponte isso e o loopback do CONTEINER, e a conexao morre com
      # "Connection refused" enquanto a pagina carrega normalmente. O pooler
      # tambem escuta na LAN, e e por la que este conteiner chega.
      A2L_DB_HOST: "192.168.3.10"

      # O DESPACHO DA MINERACAO.
      #
      # `server.py` monta o comando e, com estas variaveis, o embrulha num
      # `docker run` da imagem do minerador — a unica que tem navegador do
      # Playwright, `scrapling` e `proxy`. Sem elas a API tenta rodar local, com
      # o `.venv/Scripts/python.exe` do Windows, e o job morre na etapa 4.
      #
      # `RADAR_JOB_REPO` e o caminho NO HOST porque quem monta o volume e o
      # daemon do Docker, nao este processo.
      RADAR_JOB_DOCKER: "radar-minerador:latest"
      RADAR_JOB_REPO: "/home/a2l/Documentos/sistemas/radarComercial"
      # O daemon por TCP, atraves do proxy abaixo — o socket NAO entra neste
      # conteiner. Ele e `read_only` e `cap_drop: [ALL]`, e montar o socket aqui
      # entregaria o host inteiro a quem furasse a API.
      DOCKER_HOST: "tcp://radar-docker-proxy:2375"
      # O cliente do Docker escreve config em $HOME; aqui o sistema de arquivos
      # e somente-leitura e /tmp e o unico lugar gravavel.
      DOCKER_CONFIG: "/tmp/.docker"

    ports:
      # 7740 FORA, 7720 DENTRO. O Dockerfile fixa a porta do uvicorn em
      # 7720 e nao le `PORTA_API`; publicar 7740:7740 abria uma porta em
      # que nada escuta, e o curl respondia 000 sem dizer por que.
      - "127.0.0.1:7740:7720"
      - "${BIND_LAN:-127.0.0.1}:7740:7720"

    volumes:
      # SÓ LEITURA, e é o ponto: quem escreve aqui é o minerador. A API observa
      # `crops/<sessao>_db.json` durante a captura para o mapa ir preenchendo ao
      # vivo, e serve as imagens de `capturas/`. Montar como `:ro` faz o
      # contêiner impor o que o desenho já dizia — a API lê o resultado, não o
      # produz.
      - radar-crops:/app/crops:ro
      - radar-capturas:/app/capturas:ro
      # A ÚNICA escrita em disco da API: o original do anexo do chat. Não vai
      # para tmpfs de propósito — anexo que some no restart é pior que anexo
      # que não sobe.
      - radar-anexos:/app/anexos

    mem_limit: 1g

    # Somente-leitura como todo serviço da stack. A API não escreve em disco: o
    # que ela guarda vai para o banco ou para o Storage. As duas exceções abaixo
    # são de memória, e somem no restart.
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

    healthcheck:
      # `/api/saude` e não `/`: a raiz devolve o HTML do painel e responderia 200
      # com o banco fora do ar — um healthcheck que só prova que o processo está
      # vivo não distingue "de pé" de "de pé e inútil".
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7720/api/saude', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# VOLUMES EXTERNOS, e isto nao e preferencia.
#
# O `docker compose` PREFIXA o nome do volume com o nome do projeto. Como os
# dois composes tem `name:` diferente — sao servicos separados de proposito —,
# declarar `radar-crops` solto criaria `radar-comercial-api_radar-crops` e
# `radar-comercial-minerador_radar-crops`: DOIS discos com o mesmo apelido.
#
# O sintoma seria cruel: tudo sobe sem erro, a captura grava, e o mapa ao vivo
# fica parado porque a API esta olhando um diretorio vazio que tambem se chama
# `crops`. Nada no log diria isso.
#
# `external: true` tira o prefixo e amarra os dois no mesmo volume. Criar uma
# vez, antes da primeira subida:
#
#   docker volume create radar-crops
#   docker volume create radar-capturas
#   docker volume create radar-logs
  # ── o intermediario entre a API e o daemon ─────────────────────────────────
  #
  # A API precisa criar e derrubar conteineres de mineracao, e nada alem disso.
  # Este proxy expoe SO o que serve para isso: `CONTAINERS` para listar e criar,
  # `POST` para as escritas. Imagens, volumes, redes, `exec`, `swarm` e o resto
  # ficam recusados — o padrao da imagem e negar tudo que nao for ligado.
  #
  # HONESTIDADE SOBRE O QUE ISTO NAO RESOLVE: quem pode criar conteiner pode
  # montar o que quiser do host dentro dele. O proxy reduz a superficie, nao a
  # elimina. O que segura de verdade e a API exigir login e viver so na tailnet.
  radar-docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: radar-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    # Sem `ports:` DE PROPOSITO: so quem esta na rede deste compose alcanca.
    # Publicar 2375 no host seria abrir o daemon para a maquina inteira.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  radar-anexos:
  radar-crops:
    external: true
  radar-capturas:
    external: true
