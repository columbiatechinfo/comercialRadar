# =============================================================================
# Cabeçalhos de segurança do Comercial Radar em /seek — `include`-ado dentro de
# CADA location do seek.conf. No nginx, um bloco que declara qualquer `add_header`
# descarta os herdados do pai; repetir o include é o que garante que nenhuma
# resposta sai sem eles (mesma armadilha documentada no hippo-seguranca.conf).
#
# Diferenças para o do Hippo, e por quê:
#   - X-Frame-Options SAMEORIGIN, e não DENY: a ferramenta não se embute hoje, mas
#     a extração tem telas auxiliares e DENY não compra nada aqui.
#   - SEM Content-Security-Policy: a extração carrega mapa, fontes e Street View de
#     domínios externos que não foram inventariados. CSP sem inventário quebra tela
#     em produção; fica pendente em docs/PRODUCAO-SEEK.md.
# =============================================================================
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=()" always;
