# =============================================================================
# Comercial Radar (SEEK e extração) em https://a2lsolucoes.com/seek
#
# Instalado em /etc/nginx/seek.conf na VPS de produção (srv431755), e chamado por
# UMA linha dentro do server block de a2lsolucoes.com:
#
#     include /etc/nginx/seek.conf;
#
# O molde é o do Hippo (repositório a2lGcp, infra/nginx/hippo.conf e ADR 0004):
# uma linha no site institucional, e toda mudança da ferramenta neste arquivo.
# Procedimento em docs/PRODUCAO-SEEK.md.
#
# ─── Como o tráfego chega ─────────────────────────────────────────────────────
#
#   navegador ──https──> nginx (VPS 193.203.174.5)
#                          ├── /seek/ws   → 127.0.0.1:7740/ws   ┐ ponta do túnel
#                          └── /seek/     → 127.0.0.1:7740/     ┘ reverso do i9
#
# 127.0.0.1:7740 NÃO é serviço da VPS: é a ponta de um `ssh -R` que o i9 mantém
# sob systemd (`deploy/seek-tunel.service`). Túnel fora, tudo aqui devolve 502.
#
# A FERRAMENTA INTEIRA, e não só a SEEK — decisão do dono do produto em
# 14/09/2026, com a alternativa (só as rotas da SEEK) apresentada. Toda rota
# `/api/*` exige login no portão da API, menos as públicas de propósito
# (`/api/login`, `/api/renovar`, `/api/saude`).
#
# O PREFIXO: o nginx tira `/seek` do caminho e manda `X-Forwarded-Prefix: /seek`.
# O front fala em caminho absoluto (`/api/...`), e é a API que devolve html, js e
# json já com `/seek` na frente — só quando o cabeçalho vale exatamente isso
# (`PrefixoPublico` no server.py). Pelo endereço do Tailscale nada muda.
# =============================================================================

# `/seek` sem barra vira `/seek/`: sem ela, os caminhos relativos saem da raiz.
location = /seek {
    include /etc/nginx/seek-seguranca.conf;
    return 301 https://$host/seek/;
}

# ─── WebSocket do progresso das runs ─────────────────────────────────────────
# Bloco próprio porque só ele precisa do Upgrade. `map $http_upgrade` exigiria o
# contexto http, e o nginx.conf da VPS não é deste projeto.
location ^~ /seek/ws {
    proxy_pass http://127.0.0.1:7740/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /seek;
    # Uma run acompanha por horas; o padrão de 60 s derrubaria o socket parado.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ─── Login: a única porta que a internet pode martelar sem token ──────────────
# `seek_login` mora em /etc/nginx/conf.d/seek-limites.conf (contexto http).
location = /seek/api/login {
    include /etc/nginx/seek-seguranca.conf;
    limit_req zone=seek_login burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:7740/api/login;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /seek;
}

# ─── A aplicação ─────────────────────────────────────────────────────────────
location ^~ /seek/ {
    include /etc/nginx/seek-seguranca.conf;

    # A barra final nos dois lados tira o prefixo: `/seek/api/eu` chega como `/api/eu`.
    proxy_pass http://127.0.0.1:7740/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /seek;
    proxy_set_header X-Request-Id      $request_id;

    # Redirecionamento da API para `/x` volta como `/seek/x`.
    proxy_redirect / /seek/;

    # A carga do cadastro do cliente sobe por aqui (`/api/upload`, `/api/cadastro/`).
    client_max_body_size 512m;
    proxy_request_buffering off;

    # A fila do SEEK monta 22 mil linhas antes de responder; imagem e print passam
    # do minuto em rede ruim.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering    off;
}
