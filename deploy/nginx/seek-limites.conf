# =============================================================================
# Contexto http do Comercial Radar em /seek — instalado em
# /etc/nginx/conf.d/seek-limites.conf (o nginx.conf da VPS inclui conf.d/*.conf).
#
# `limit_req_zone` só existe no contexto http, e por isso não pode morar no
# seek.conf, que é incluído dentro do server block. 10 tentativas de login por
# minuto por IP, com rajada de 10: sobra para quem erra a senha, e tira a graça de
# quem tenta senha em lote agora que o login está na internet.
# =============================================================================
limit_req_zone $binary_remote_addr zone=seek_login:10m rate=10r/m;
