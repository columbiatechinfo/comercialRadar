# Minerador do Radar Comercial — a exceção ao molde da stack, e por quê.
#
#   docker compose -f compose.radar-comercial-minerador.yml up -d --build
#
# TODO SERVIÇO DA STACK SOBE `read_only: true`. Este não sobe, e isso foi
# decidido em 30/08/2026 com o custo à vista. Dez Chromium escrevem perfil,
# cache, cookie e crash dump em disco o tempo todo; num sistema de arquivos
# somente-leitura o navegador nem abre. Não há configuração que resolva — é
# assim que o Chromium funciona.
#
# O QUE FOI FEITO PARA A EXCEÇÃO CUSTAR O MENOS POSSÍVEL:
#
#   · o serviço NÃO publica porta nenhuma. Ele não é alcançável de fora do
#     host, nem pela LAN. A única superfície é o que ele mesmo vai buscar;
#   · a API continua no molde, `read_only` e tudo. A exceção fica aqui, num
#     contêiner que não serve requisição;
#   · `cap_drop: [ALL]` e `no-new-privileges` continuam valendo: o que ele
#     precisa é escrever no próprio disco, não é privilégio de sistema;
#   · o disco gravável é só o que ele usa — `crops`, `capturas`, `logs` e o
#     perfil dos navegadores. O resto da imagem segue intocado.

name: radar-comercial-minerador

services:
  # O SERVICO CHAMA-SE `worker`, e nao como o projeto.
  #
  # Com os dois iguais o Compose gera
  # `radar-comercial-minerador-radar-comercial-minerador-1` — quarenta e nove
  # caracteres que ninguem le num `docker ps` nem digita num `docker logs`.
  # Assim sai `radar-comercial-minerador-worker-1`, que continua casando com a
  # convencao `radar-*` desta maquina compartilhada.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.minerador
    # SEM `container_name`, e isso e o que permite escalar.
    #
    # Nome fixo e um conteiner so: `--scale` falha com "container name must be
    # unique". Sem ele o Compose numera sozinho —
    # `radar-comercial-minerador-1`, `-2`, `-3` —, o que continua respeitando a
    # convencao `radar-*` desta maquina compartilhada.
    #
    # QUANTAS REPLICAS E QUANTAS RODADAS SIMULTANEAS SAO A MESMA COISA: cada
    # worker pega UM job por vez do `for update skip locked`. Duas replicas,
    # duas rodadas ao mesmo tempo.
    restart: unless-stopped

    deploy:
      replicas: ${MINERADORES:-2}

    env_file:
      - ../.env

    environment:
      # A 7100 — MODO SESSÃO. O ETL faz poucas conexões com trabalho longo, e em
      # modo transação morrem tabela temporária entre transações, prepared
      # statement e lock de sessão. É divergência assumida do doc 23, registrada
      # em docs/AMBIENTE_A2L.md.
      PYTHONUNBUFFERED: "1"

      # O TETO DE TRABALHADORES E DA MAQUINA, e nao do pedido — ver a nota em
      # `minerador_worker.MAX_TRABALHADORES`. Quem clica no painel nao sabe se a
      # rodada vai cair no servidor de 123 GB ou no notebook de 45; a maquina
      # que a pegar apara o numero e diz no log da rodada que aparou.
      #
      #   servidor principal   RADAR_MAX_TRABALHADORES=30   (padrao)
      #   notebook             RADAR_MAX_TRABALHADORES=10
      RADAR_MAX_TRABALHADORES: ${MAX_TRABALHADORES:-30}

    # SEM `ports`. Não é esquecimento: ele consome fila do banco e não atende
    # ninguém. Publicar porta aqui seria abrir superfície para nada.

    volumes:
      # O mapa ao vivo lê `crops/<sessao>_db.json` enquanto a captura roda. Quem
      # escreve é este contêiner; quem lê é a API. Sem o volume compartilhado, o
      # operador veria a tela parada até o fim da rodada — justamente a hora em
      # que ele quer ver o marcador caindo.
      - radar-crops:/app/crops
      - radar-capturas:/app/capturas
      - radar-logs:/app/logs

    # /dev/shm PADRÃO É 64 MB, e dez Chromium não cabem nisso.
    #
    # O código já passa `--disable-dev-shm-usage`, que manda o Chromium usar
    # /tmp em vez da memória compartilhada — então isto é cinto além do
    # suspensório. Fica porque a flag pode sair de `human_browser.py` num
    # ajuste futuro, e o sintoma de /dev/shm cheio é a aba morrer sem erro
    # legível: "Target page, context or browser has been closed", que é
    # exatamente a mensagem que já custou uma investigação inteira em 29/08.
    shm_size: 2gb

    # MEDIDO, e nao arredondado. Em 04/09/2026, 30 trabalhadores de captura
    # sobre 143 POIs levaram o conteiner a 13,8 GiB de pico — o teto de 12 g o
    # teria matado no meio, e a rodada morreria sem erro que apontasse para
    # aqui: o OOM killer nao escreve no log da aplicacao.
    #
    # 24 g deixa folga de quase o dobro do pico medido e ainda permite tres
    # workers simultaneos numa maquina de 123 GB. Dez trabalhadores, que e o
    # padrao, custam 3,3 GB — o teto so entra em jogo em rodada grande.
    # O PADRAO E O DO SERVIDOR. No notebook, `MEM_WORKER=12g` — 45 GB de RAM
    # com nominatim, photon e dois OSRM ja de pe nao comportam 24 por replica.
    mem_limit: ${MEM_WORKER:-24g}

    read_only: false     # a exceção, explicada no cabeçalho
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # O sandbox do Chromium precisa de user namespaces. `unconfined` no seccomp
      # é o que a própria Microsoft recomenda para a imagem do Playwright; sem
      # isso a alternativa seria `--no-sandbox`, que é PIOR — desliga a barreira
      # entre a página e o processo.
      - seccomp=unconfined

    healthcheck:
      # Ele não tem porta, então o healthcheck pergunta ao BANCO se este worker
      # deu sinal de vida. Um worker travado com o processo vivo é o caso comum:
      # o Chromium pendura e o Python fica esperando para sempre.
      test: ["CMD", "python", "minerador_worker.py", "--saude"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# VOLUMES EXTERNOS, e isto nao e preferencia.
#
# O `docker compose` PREFIXA o nome do volume com o nome do projeto. Como os
# dois composes tem `name:` diferente — sao servicos separados de proposito —,
# declarar `radar-crops` solto criaria `radar-comercial-api_radar-crops` e
# `radar-comercial-minerador_radar-crops`: DOIS discos com o mesmo apelido.
#
# O sintoma seria cruel: tudo sobe sem erro, a captura grava, e o mapa ao vivo
# fica parado porque a API esta olhando um diretorio vazio que tambem se chama
# `crops`. Nada no log diria isso.
#
# `external: true` tira o prefixo e amarra os dois no mesmo volume. Criar uma
# vez, antes da primeira subida:
#
#   docker volume create radar-crops
#   docker volume create radar-capturas
#   docker volume create radar-logs
volumes:
  radar-crops:
    external: true
  radar-capturas:
    external: true
  radar-logs:
    external: true
